<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>منصة المدير</title>
<meta name="theme-color" content="#0B6B55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a right-hand rail (school identity + sections) beside a working area; official forms render as white paper sheets signed in blue ink. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EEEC; --ink:#13201D; --muted:#5A6A65; --line:#D8E1DE;
  --accent:#0B6B55; --accent-ink:#FFFFFF; --accent-soft:#E1F0EA;
  --sig:#1D3F8F;
  --ok:#11703A; --ok-soft:#E3F3E8; --warn:#9A5700; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE7E4;
  --shadow:0 1px 2px rgba(19,32,29,.06),0 8px 24px rgba(19,32,29,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#15201D; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98A9A3; --line:#2A3934;
  --accent:#3DB592; --accent-ink:#04231B; --accent-soft:#16372E; --sig:#93B2FF;
  --ok:#5BD18B; --ok-soft:#143A24; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8C7C; --bad-soft:#401D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98A9A3; --line:#2A3934;
  --accent:#3DB592; --accent-ink:#04231B; --accent-soft:#16372E; --sig:#93B2FF;
  --ok:#5BD18B; --ok-soft:#143A24; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8C7C; --bad-soft:#401D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);padding-block:24px;padding-inline:18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand h1{font-size:20px}
.brand .school{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 6px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
.who{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.who b{color:var(--ink);font-weight:600}

.main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;min-width:0;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h2{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.wa{color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:16px}
.panel .sub{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .m{font-size:13px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--sunk);color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:10px 12px;background:var(--sunk);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.acts{white-space:nowrap}
.tbl td.acts .btn{margin-inline-start:4px}
.phone{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all}
.sigthumb{height:34px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 6px}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--warn);border-radius:5px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:end}

.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:14px}
.contact .k{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .t{font-weight:600}
.card .m{font-size:13px;color:var(--muted)}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.notice-bar{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.notice-bar.info{background:var(--accent-soft);color:var(--accent)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,17,.45);display:grid;place-items:center;z-index:50;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);border-radius:14px;width:min(720px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dlg.wide{width:min(900px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h3{font-size:18px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lb{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{min-height:90px;resize:vertical;line-height:1.7}
.f .hint{font-size:12px;color:var(--muted)}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.sigbox{border:1.5px dashed var(--line);border-radius:10px;background:#FFFFFF;position:relative}
.sigbox canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigbox .ph{position:absolute;inset:auto 12px 10px auto;font-size:12px;color:#8A9893;pointer-events:none}
.sigbox .line{position:absolute;inset:auto 24px 34px 24px;border-top:1px solid #C9D3CF;pointer-events:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:860px){
  .app{display:block}
  .side{position:static;height:auto;border-inline-start:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;gap:14px}
  .nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .nav button{padding:8px 10px;font-size:14px}
  .who{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fg{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav button{transition:background .15s,border-color .15s}}
</style>
<style id="docCss">
/* Official paper form: fixed white sheet in both themes, like the printed original. */
.paper{background:#fff;color:#111;border:1px solid #cfd6d3;border-radius:6px;padding:28px 30px;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:14.5px;line-height:1.9;direction:rtl;max-width:820px;margin:0 auto}
.paper .dh{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;border-bottom:2px solid #0B6B55;padding-bottom:12px;margin-bottom:14px;font-size:13px}
.paper .dh .l{text-align:left}
.paper .dt{font-family:"Readex Pro",Tahoma,sans-serif;font-size:19px;font-weight:700;text-align:center;color:#0B6B55;line-height:1.4}
.paper .dt small{display:block;font-size:13px;color:#333;font-weight:500}
.paper h4{margin:16px 0 6px;font-size:14px;background:#EEF4F1;padding:4px 10px;border-radius:4px;color:#0B4D3E}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px}
.paper td,.paper th{border:1px solid #c9d1ce;padding:5px 8px;text-align:start}
.paper th{background:#F5F8F7;font-weight:600;width:22%}
.paper p{margin:6px 0}
.paper .sigrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;font-size:13px;align-items:end}
.paper .sigrow img{height:54px;max-width:100%;display:block}
.paper .sigrow .ln{border-bottom:1px dotted #888;min-height:56px;display:flex;align-items:flex-end}
.paper .opt{display:flex;gap:8px;align-items:flex-start}
.paper .box{display:inline-block;width:15px;height:15px;border:1.5px solid #333;border-radius:2px;flex:none;margin-top:6px;text-align:center;line-height:12px;font-size:12px;font-weight:700;color:#0B6B55}
.paper .foot{margin-top:18px;border-top:1px solid #ddd;padding-top:8px;font-size:11.5px;color:#555}
.paper .pend{color:#9A5700}
.paper .ltr{direction:ltr;unicode-bidi:isolate}
@media (max-width:600px){.paper{padding:18px 16px}.paper .dh{grid-template-columns:1fr;text-align:center}.paper .dh .l{text-align:center}.paper .sigrow{grid-template-columns:1fr}}
</style>
<style>
/* login and portal screens */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate .box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gate h1{font-size:22px}
.gate p{margin:0;color:var(--muted);font-size:14px}
.portal{max-width:860px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.portal .brandbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:12px}
.portal .brandbar h1{font-size:22px}
.portal .brandbar .m{color:var(--muted);font-size:13px}
.done{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:14px 16px;font-weight:600}
#printArea{display:none}
@media print{
  body{background:#fff}
  body.printing > *:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea .paper{border:0;max-width:none;padding:0}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>

<div id="gateRoot"></div>
<div class="app" id="appRoot" hidden>
  <aside class="side">
    <div class="brand">
      <span class="eyebrow" id="regionLine"></span>
      <h1>منصة المدير</h1>
      <span class="school" id="schoolLine"></span>
    </div>
    <nav class="nav" id="nav" aria-label="أقسام المنصة"></nav>
    <div class="who" id="who"><span>جارٍ التعرف على صلاحيتك…</span></div>
  </aside>
  <main class="main" id="main">
    <div class="head"><div><h2>لوحة المتابعة</h2><p>جارٍ الاتصال بقاعدة بيانات المنصة…</p></div></div>
    <div class="empty">ستظهر هنا أعداد المعلمين والغياب والمساءلات واختبارات اليوم بعد التحميل.</div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
const z = n => String(n).padStart(2,'0');
const isoDay = (d = new Date()) => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
let fH, fDay, fStamp;
try { fH = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}); } catch { fH = null; }
try { fDay = new Intl.DateTimeFormat('ar-SA', {weekday:'long'}); } catch { fDay = null; }
try { fStamp = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'}); } catch { fStamp = null; }
const hij = s => { if (!s) return '—'; try { return fH ? fH.format(parseD(s)) : s; } catch { return s; } };
const dayName = s => { try { return fDay ? fDay.format(parseD(s)) : ''; } catch { return ''; } };
const stamp = ts => { if (!ts) return '—'; try { return fStamp ? fStamp.format(new Date(ts)) : new Date(ts).toLocaleString(); } catch { return ''; } };

/* ---------- phones ---------- */
function intl(p){ let d = String(p||'').replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05') && d.length === 10) d = '966' + d.slice(1); else if (d.startsWith('5') && d.length === 9) d = '966' + d;
  return d.length >= 11 ? d : ''; }
const waLink = (phone, text) => { const n = intl(phone); return n ? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : ''; };
const phoneCell = p => p ? `<span class="phone">${esc(p)}</span> <button class="btn sm" data-act="copy" data-v="${esc(p)}" title="نسخ الرقم">نسخ</button>` : '<span class="m">—</span>';

/* ---------- state ---------- */
const COLS = ['teachers','absences','notices','committees','exams','parents','docs'];
const S = { settings:{}, loaded:false };
COLS.forEach(c => S[c] = []);
/* ---------- server ---------- */
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://127.0.0.1:8799' : 'https://mudeer-api.khuf-school.workers.dev';
const SELLER = '966535677847';
const BASE = location.origin + location.pathname;
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} } };
const hashArg = (k) => { const m = location.hash.match(new RegExp('[#&]' + k + '=([0-9a-f]{32})')); return m ? m[1] : ''; };
const MODE = hashArg('t') ? 'teacher' : hashArg('p') ? 'parent' : 'admin';
const KEY = hashArg('t') || hashArg('p');
let token = store.get('mdr.token');
const ERR = {
  wrong_password:'كلمة المرور غير صحيحة.', wrong_login:'رمز المدرسة أو كلمة المرور غير صحيحة.', bad_key:'مفتاح التفعيل غير صحيح لرمز المدرسة هذا. انسخه كاملًا كما وصلك.', bad_code:'رمز المدرسة غير صحيح.', already_registered:'هذه المدرسة مسجلة من قبل. ادخل برمزها وكلمة مرورها.', too_many_attempts:'محاولات كثيرة خاطئة. انتظر ربع ساعة ثم أعد المحاولة.', weak_password:'كلمة المرور قصيرة، اكتب ٦ أحرف أو أرقام على الأقل.',

async function api(path, opt = {}){
  const headers = {...(opt.headers || {})};
  if (token && MODE === 'admin') headers.Authorization = 'Bearer ' + token;
  if (opt.json !== undefined) { headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(opt.json); }
  let r;
  try { r = await fetch(API + '/api' + path, {method: opt.method || 'GET', headers, body: opt.body}); }
  catch { throw {code:'network', message:'تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم أعد المحاولة.'}; }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const code = data.error || 'server_error'; if (code === 'unauthorized' && MODE === 'admin') { token = null; store.set('mdr.token', null); setTimeout(showLogin, 0); } throw {code, message: ERR[code] || 'تعذّر إكمال العملية. أعد المحاولة.'}; }
  return data;
}

/* ---------- toasts / errors ---------- */
function toast(msg, kind){ const r = $('#toastRoot'); r.innerHTML = `<div class="toast ${kind||''}" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = '', 3200); }
const errMsg = e => (e && e.message) || 'تعذّر إكمال العملية. أعد المحاولة.';
function upsert(col, id, data, merge){
  if (col === 'settings') { S.settings = merge ? {...S.settings, ...data} : {...data}; return; }
  const arr = S[col]; if (!arr) return; const i = arr.findIndex(x => x.id === id);
  const doc = {...(merge && i >= 0 ? arr[i] : {}), ...data, id};
  if (i >= 0) arr[i] = doc; else arr.push(doc);
}
// المدير يكتب أي مستند؛ المعلم وولي الأمر يرسلان التوقيع فقط عبر روابطهما
async function put(path, data, merge){
  const [col, id] = path.split('/');
  try {
    if (MODE === 'teacher') await api(`/t/${KEY}/${col}/${id}`, {method:'POST', json:data});
    else if (MODE === 'parent') await api(`/p/${KEY}`, {method:'POST', json:data});
    else await api(`/doc/${col}/${id}`, {method: merge ? 'PATCH' : 'PUT', json:data});
    upsert(col, id, data, merge); render(); return true;
  } catch(e){ toast(errMsg(e), 'bad'); return false; }
}
async function del(path){
  const [col, id] = path.split('/');
  try { await api(`/doc/${col}/${id}`, {method:'DELETE'}); S[col] = S[col].filter(x => x.id !== id); render(); toast('تم الحذف'); return true; }
  catch(e){ toast(errMsg(e),'bad'); return false; }
}

const pads = {};
function mountSig(id){
  const c = document.getElementById(id); if (!c) return;
  const ratio = window.devicePixelRatio || 1;
  const fit = () => { c.width = c.clientWidth * ratio; c.height = c.clientHeight * ratio; const x = c.getContext('2d'); x.scale(ratio, ratio); x.lineCap='round'; x.lineJoin='round'; x.lineWidth=2.4; x.strokeStyle='#1D3F8F'; };
  fit();
  const ctx = c.getContext('2d'); let down = false, last = null; const pad = { dirty:false };
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => { down = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, 6.3); ctx.fillStyle='#1D3F8F'; ctx.fill(); pad.dirty = true; });
  c.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const up = () => { down = false; }; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  pad.clear = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height); ctx.restore(); pad.dirty = false; };
  pad.data = () => { if (!pad.dirty) return null; const o = document.createElement('canvas'); o.width = 480; o.height = Math.round(480 * c.height / c.width); o.getContext('2d').drawImage(c, 0, 0, o.width, o.height); return o.toDataURL('image/png'); };
  pads[id] = pad;
}

function saveBlob(filename, data, type){
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast('تم تنزيل الملف');
}
function saveHtml(name, inner){
  const html = `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(name)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Readex+Pro:wght@600;700&display=swap"><style>body{margin:24px;background:#fff}${$('#docCss').textContent}@media print{body{margin:0}.paper{border:0}}</style></head><body>${inner}</body></html>`;
  saveBlob(name + '.html', html, 'text/html;charset=utf-8');
}

  const V = {dash:vDash, teachers:vTeachers, notices:vNotices, control:vControl, parents:vParents, archive:vArchive, settings:vSettings}[UI.tab] || vDash;
  m.innerHTML = V();
}
const head = (title, sub, tools) => `<div class="head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${tools ? `<div class="tools">${tools}</div>` : ''}</div>`;
const loadingNote = () => S.loaded ? '' : '<div class="notice-bar info">جارٍ تحميل البيانات…</div>';

/* ---------- views ---------- */
function vDash(){
  const today = isoDay(), month = today.slice(0,7);
  const absM = S.absences.filter(a => (a.date||'').startsWith(month));
  const waitT = S.notices.filter(n => n.status === 'issued'), waitP = S.notices.filter(n => n.status === 'replied');
  const exToday = S.exams.filter(e => e.date === today), parPend = S.parents.filter(p => !p.parentSig);
  const cnt = {}; S.absences.forEach(a => { cnt[a.teacherId] = (cnt[a.teacherId]||0) + 1; });
  const top = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,7); const mx = top[0]?.[1] || 1;
  const actions = [
    ...waitP.map(n => ({t:`مساءلة ${n.no} — ${tName(n.teacherId)}`, m:'ردّ المعلم، وتنتظر قرارك وتوقيعك', c:['info','قرار المدير'], act:'viewNotice', id:n.id})),
    ...waitT.map(n => ({t:`مساءلة ${n.no} — ${tName(n.teacherId)}`, m:`${n.kind} · ${hij(n.date)}`, c:['warn','رد المعلم'], act:'viewNotice', id:n.id})),
    ...parPend.slice(0,6).map(p => ({t:`${p.kind} — ${p.student}`, m:`ولي الأمر: ${p.parentName||'—'}`, c:['warn','توقيع ولي الأمر'], act:'viewParent', id:p.id}))
  ].slice(0,10);
  const setupNeeded = !set().phone || !S.teachers.length;
  return head('لوحة المتابعة', `${dayName(today)} ${hij(today)}`, isAdmin() ? `<button class="btn pri" data-act="recAbs">تسجيل غياب أو تأخر</button><button class="btn" data-act="issue">إصدار مساءلة</button>` : '') + loadingNote() +
  `<div class="kpis">
    <div class="kpi"><span class="v">${S.teachers.length}</span><span class="l">معلمًا في المدرسة</span></div>
    <div class="kpi ${absM.length?'warn':''}"><span class="v">${absM.length}</span><span class="l">غياب وتأخر هذا الشهر</span></div>
    <div class="kpi ${waitT.length?'warn':''}"><span class="v">${waitT.length}</span><span class="l">مساءلة بانتظار رد المعلم</span></div>
    <div class="kpi ${waitP.length?'bad':''}"><span class="v">${waitP.length}</span><span class="l">بانتظار قرار المدير</span></div>
    <div class="kpi"><span class="v">${exToday.length}</span><span class="l">اختبار اليوم</span></div>
    <div class="kpi ${parPend.length?'warn':''}"><span class="v">${parPend.length}</span><span class="l">نموذج ينتظر ولي الأمر</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><h3>يحتاج إجراء</h3>
      ${actions.length ? `<div class="list">${actions.map(a => `<div class="row"><div><div class="t">${esc(a.t)}</div><div class="m">${esc(a.m)}</div></div><div class="tools"><span class="chip ${a.c[0]}">${a.c[1]}</span><button class="btn sm" data-act="${a.act}" data-id="${a.id}">فتح</button></div></div>`).join('')}</div>`
        : setupNeeded ? `<p class="sub">ابدأ تشغيل المنصة بهذه الخطوات:</p><ol class="steps"><li>أكمل بيانات المدرسة ورقم جوال المدير من <a href="#settings" data-act="tab" data-id="settings">الإعدادات</a>.</li><li>أضف المعلمين بأسمائهم وأرقام جوالاتهم من <a href="#teachers" data-act="tab" data-id="teachers">المعلمون والغياب</a>.</li><li>أرسل لكل معلم رابطه الخاص بالواتساب ليوقّع منه على مساءلاته ومظاريف الاختبارات.</li><li>أنشئ لجان الاختبارات وجدولها من <a href="#control" data-act="tab" data-id="control">كنترول الاختبارات</a>.</li></ol>`
        : '<div class="empty">لا توجد مساءلات أو نماذج معلقة.</div>'}
    </section>
    <section class="panel"><h3>الأكثر غيابًا وتأخرًا</h3><p class="sub">عدد السجلات منذ بداية العام</p>
      ${top.length ? `<div class="bars">${top.map(([id,n]) => `<div class="bar"><span>${esc(tName(id))}</span><div class="track"><div class="fill" style="width:${Math.round(n/mx*100)}%"></div></div><span class="n">${n}</span></div>`).join('')}</div>` : '<div class="empty">لم يُسجَّل غياب بعد.</div>'}
      <h3 style="margin-top:8px">أرقام التواصل</h3>
      <div class="contact">
        <span class="k">مدير المدرسة</span><span>${esc(principal())}</span><span>${set().phone ? phoneCell(set().phone) : '<a href="#settings" data-act="tab" data-id="settings">أضف الرقم</a>'}</span>
        ${set().deputy ? `<span class="k">الوكيل</span><span>${esc(set().deputy)}</span><span>${phoneCell(set().deputyPhone)}</span>` : ''}
        ${set().controlHead ? `<span class="k">رئيس الكنترول</span><span>${esc(set().controlHead)}</span><span>${phoneCell(set().controlPhone)}</span>` : ''}
      </div>
    </section>
  </div>`;
}

function vTeachers(){
  const rows = sortBy(S.teachers, 'name').map(t => {
    const ab = S.absences.filter(a => a.teacherId === t.id);
    const g = ab.filter(a => a.type === 'غياب').length, l = ab.length - g, nn = S.notices.filter(n => n.teacherId === t.id).length;
    const wa = waLink(t.phone, `المكرم الأستاذ/ ${t.name}\nالسلام عليكم ورحمة الله وبركاته\nهذا رابطك الخاص في منصة ${school()}، تجد فيه مساءلاتك ومظاريف الاختبارات المطلوب توقيعها:\n${teacherLink(t)}\nاحتفظ به ولا تشاركه.`);
    return `<tr><td><b>${esc(t.name)}</b><div class="m" style="font-size:12px;color:var(--muted)">${esc(t.specialty||'')}</div></td>
      <td>${phoneCell(t.phone)} ${wa ? `<a class="btn sm wa" href="${esc(wa)}" target="_blank" rel="noopener">واتساب</a>` : ''}</td>
      <td class="num">${g}</td><td class="num">${l}</td><td class="num">${nn}</td>
      <td class="acts"><button class="btn sm" data-act="teacherFile" data-id="${t.id}">السجل</button><button class="btn sm" data-act="copy" data-v="${esc(teacherLink(t))}">نسخ رابط المعلم</button>
        <button class="btn sm" data-act="recAbs" data-id="${t.id}">تسجيل غياب</button><button class="btn sm" data-act="editTeacher" data-id="${t.id}">تعديل</button><button class="btn sm danger" data-act="delTeacher" data-id="${t.id}">حذف</button></td></tr>`;
  }).join('');
  return head('المعلمون والغياب', 'أسماء المعلمين وأرقام جوالاتهم وسجل الغياب والتأخر لكل معلم.',
    (isAdmin() ? `<button class="btn pri" data-act="recAbs">تسجيل غياب أو تأخر</button><button class="btn" data-act="addTeacher">إضافة معلم</button><button class="btn" data-act="bulkTeachers">إضافة مجموعة</button>` : '') + `<button class="btn" data-act="exportAbs">تنزيل سجل الغياب</button>`) + loadingNote() +
    (S.teachers.length ? '<div class="notice-bar info">لكل معلم رابط خاص يوقّع منه دون كلمة مرور. زر «واتساب» يرسل له رابطه، ورسالة كل مساءلة تحمل الرابط نفسه.</div>' : '') +
    (S.teachers.length ? `<div class="tablewrap"><table class="tbl"><thead><tr><th>المعلم</th><th>الجوال</th><th>غياب</th><th>تأخر وخروج</th><th>مساءلات</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">لا يوجد معلمون بعد. ${isAdmin() ? 'اضغط «إضافة مجموعة» والصق الأسماء والأرقام دفعة واحدة.' : ''}</div>`);
}

function vNotices(){
  const f = UI.nFilter;
  const list = sortBy(S.notices, 'createdAt', -1).filter(n => f === 'all' || n.status === f);
  const seg = [['all','الكل'],['issued','بانتظار المعلم'],['replied','بانتظار القرار'],['closed','مغلقة']].map(([k,l]) => `<button data-act="nFilter" data-id="${k}" aria-pressed="${f===k}">${l}</button>`).join('');
  return head('المساءلات', 'تصدر المساءلة، فيكتب المعلم إفادته ويوقّع، ثم يصدر قرار المدير بتوقيعه.', (isAdmin() ? '<button class="btn pri" data-act="issue">إصدار مساءلة</button>' : '')) + loadingNote() +
    `<div class="seg" role="group" aria-label="تصفية">${seg}</div>` +
    (list.length ? `<div class="cards">${list.map(n => { const [c,l] = nStatus(n); const t = teacher(n.teacherId);
      const wa = t && waLink(t.phone, noticeMsg(n));

        <div class="m">${esc(dayName(n.date))} ${esc(hij(n.date))}${(n.attachments||[]).length ? ' · ' + n.attachments.length + ' مرفق' : ''}</div>

function vControl(){
  const ct = UI.cTab;
  const seg = [['exams','جدول الاختبارات والمظاريف'],['committees','اللجان والطلاب']].map(([k,l]) => `<button data-act="cTab" data-id="${k}" aria-pressed="${ct===k}">${l}</button>`).join('');
  const studs = S.committees.reduce((s,c) => s + (c.students||[]).length, 0);
  const done = S.exams.filter(e => e.ret).length;
  const kp = `<div class="kpis"><div class="kpi"><span class="v">${S.committees.length}</span><span class="l">لجنة</span></div><div class="kpi"><span class="v">${studs}</span><span class="l">طالبًا موزعين على اللجان</span></div><div class="kpi"><span class="v">${S.exams.length}</span><span class="l">اختبارًا في الجدول</span></div><div class="kpi ${done<S.exams.length?'warn':''}"><span class="v">${done}/${S.exams.length}</span><span class="l">مظروف أُعيد للكنترول</span></div></div>`;
  let body;
  if (ct === 'committees') {
    body = S.committees.length ? `<div class="cards">${sortBy(S.committees,'name').map(c => `<article class="card"><div class="top"><div><div class="t">${esc(c.name)}</div><div class="m">${esc(c.place||'')}${c.grade ? ' · ' + esc(c.grade) : ''}</div></div><span class="chip info num">${(c.students||[]).length} طالب</span></div>
      <div class="m">أرقام الجلوس: <span class="num">${(c.students||[]).length ? esc(c.students[0].seat) + ' – ' + esc(c.students[c.students.length-1].seat) : '—'}</span></div>
      <div class="acts"><button class="btn sm pri" data-act="viewCommittee" data-id="${c.id}">كشف الطلاب</button>${isAdmin() ? `<button class="btn sm" data-act="editCommittee" data-id="${c.id}">تعديل</button><button class="btn sm danger" data-act="delCommittee" data-id="${c.id}">حذف</button>` : ''}</div></article>`).join('')}</div>`
      : '<div class="empty">لا توجد لجان. أنشئ لجنة والصق أسماء طلابها، وستُرقَّم أرقام الجلوس تلقائيًا.</div>';
  } else {
    const ex = [...S.exams].sort((a,b) => (a.date+a.period).localeCompare(b.date+b.period));
    body = ex.length ? `<div class="tablewrap"><table class="tbl"><thead><tr><th>اليوم والتاريخ</th><th>المادة</th><th>الصف</th><th>الفترة</th><th>اللجنة</th><th>الملاحظ</th><th>استلام الأسئلة</th><th>تسليم الإجابات</th><th></th></tr></thead><tbody>
      ${ex.map(e => `<tr><td>${esc(dayName(e.date))}<div style="font-size:12px;color:var(--muted)">${esc(hij(e.date))}</div></td><td><b>${esc(e.subject)}</b></td><td>${esc(e.grade||'—')}</td><td>${esc(e.period||'—')}</td><td>${esc(committee(e.committeeId)?.name||'—')}</td><td>${esc(tName(e.observerId))}</td>
        <td>${e.recv ? `${sigImg(e.recv,30)}<div style="font-size:12px;color:var(--muted)">${esc(e.recv.name)} · ${esc(stamp(e.recv.at))}</div>` : `<button class="btn sm" data-act="envRecv" data-id="${e.id}">توقيع الاستلام</button>`}</td>
        <td>${e.ret ? `${sigImg(e.ret,30)}<div style="font-size:12px;color:var(--muted)">حاضر ${esc(e.ret.present)} · غائب ${esc(e.ret.absent)}</div>` : e.recv ? `<button class="btn sm" data-act="envRet" data-id="${e.id}">توقيع التسليم</button>` : '<span class="chip mute">بعد الاستلام</span>'}</td>
        <td class="acts"><button class="btn sm" data-act="stuAbs" data-id="${e.id}">غياب طالب</button>${isAdmin() ? `<button class="btn sm" data-act="editExam" data-id="${e.id}">تعديل</button><button class="btn sm danger" data-act="delExam" data-id="${e.id}">حذف</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">الجدول فارغ. أضف الاختبارات بالمادة والتاريخ واللجنة والملاحظ، ثم يوقّع الملاحظ على استلام الأسئلة وتسليم أوراق الإجابة.</div>';
  }
  return head('كنترول الاختبارات', 'لجان الاختبار، وجدول المواد، وتسليم واستلام المظاريف بتوقيع الملاحظ.',
    (isAdmin() ? `<button class="btn pri" data-act="${ct==='committees'?'addCommittee':'addExam'}">${ct==='committees'?'إضافة لجنة':'إضافة اختبار'}</button>` : '') + `<button class="btn" data-act="dlEnv">تنزيل محضر المظاريف</button>`) + loadingNote() + kp + `<div class="seg" role="group" aria-label="أقسام الكنترول">${seg}</div>` + body;
}

  return head('أولياء الأمور', 'إشعارات وإقرارات يوقّعها ولي الأمر إلكترونيًا: غياب عن اختبار، استلام الجدول، الاطلاع على النتيجة.', '<button class="btn pri" data-act="addParent">نموذج جديد لولي أمر</button>') + loadingNote() +
    `<div class="seg" role="group" aria-label="تصفية">${seg}</div>` +
    (list.length ? `<div class="cards">${list.map(p => { const wa = waLink(p.parentPhone, parentMsg(p));
      return `<article class="card"><div class="top"><div><div class="t">${esc(p.student)}</div><div class="m">${esc(p.kind)}${p.grade ? ' · ' + esc(p.grade) : ''}</div></div>${p.parentSig ? '<span class="chip ok">موقّع</span>' : '<span class="chip warn">بانتظار ولي الأمر</span>'}</div>
      <div class="m">ولي الأمر: ${esc(p.parentName||'—')} ${p.parentPhone ? '· <span class="phone">' + esc(p.parentPhone) + '</span>' : ''}</div>
      <div class="acts"><button class="btn sm pri" data-act="viewParent" data-id="${p.id}">عرض النموذج</button>${!p.parentSig ? `<button class="btn sm" data-act="signParent" data-id="${p.id}">توقيع ولي الأمر</button>` : ''}${wa ? `<a class="btn sm wa" href="${esc(wa)}" target="_blank" rel="noopener">إرسال واتساب</a>` : ''}</div></article>`; }).join('')}</div>`
      : `<div class="empty">${S.parents.length ? 'لا توجد نماذج في هذا التصنيف.' : 'لا توجد نماذج لأولياء الأمور بعد. تُنشأ من الزر أعلاه، أو تلقائيًا عند تسجيل غياب طالب عن اختبار.'}</div>`);
}

function vArchive(){
  const att = [...S.notices.flatMap(n => (n.attachments||[]).map(a => ({...a, src:`مساءلة ${n.no} — ${tName(n.teacherId)}`}))), ...S.parents.flatMap(p => (p.attachments||[]).map(a => ({...a, src:`${p.kind} — ${p.student}`})))];
  const docs = sortBy(S.docs, 'at', -1);
  const signed = S.notices.filter(n => n.teacherSig).length + S.notices.filter(n => n.decisionSig).length + S.parents.filter(p => p.parentSig).length + S.exams.filter(e => e.recv).length + S.exams.filter(e => e.ret).length;
  return head('الأرشيف', 'كل ما رُفع إلى المنصة من مستندات، ومرفقات المساءلات ونماذج أولياء الأمور.', '<button class="btn pri" data-act="upload">رفع مستند</button>') +
    `<div class="kpis"><div class="kpi"><span class="v">${docs.length}</span><span class="l">مستندًا مرفوعًا</span></div><div class="kpi"><span class="v">${att.length}</span><span class="l">مرفقًا مع النماذج</span></div><div class="kpi"><span class="v">${signed}</span><span class="l">توقيعًا إلكترونيًا محفوظًا</span></div></div>
    <section class="panel"><h3>المستندات المرفوعة</h3>${docs.length ? `<div class="list">${docs.map(d => `<div class="row"><div><div class="t">${esc(d.title)}</div><div class="m">${esc(d.category)} · ${esc(d.file?.name||'')} · ${esc(stamp(d.at))}</div></div><div class="tools"><a class="btn sm" href="${esc(fileUrl(d.file?.id))}" target="_blank" rel="noopener">فتح</a>${isAdmin() ? `<button class="btn sm danger" data-act="delDoc" data-id="${d.id}">حذف</button>` : ''}</div></div>`).join('')}</div>` : '<div class="empty">لم يُرفع أي مستند بعد. ارفع التعاميم والمحاضر الموقّعة وكشوف الكنترول هنا.</div>'}</section>
    <section class="panel"><h3>مرفقات النماذج</h3>${att.length ? `<div class="list">${att.map(a => `<div class="row"><div><div class="t">${esc(a.name)}</div><div class="m">${esc(a.src)} · ${esc(stamp(a.at))}</div></div><a class="btn sm" href="${esc(fileUrl(a.id))}" target="_blank" rel="noopener">فتح</a></div>`).join('')}</div>` : '<div class="empty">ستظهر هنا الأعذار الطبية والمستندات التي يرفقها المعلمون وأولياء الأمور.</div>'}</section>`;
}

document.addEventListener('visibilitychange', () => { if (MODE === 'admin' && token && S.loaded && document.visibilityState === 'visible' && !$('#modalRoot').innerHTML) loadAll(); });
function changePwForm(){
  modal('تغيير كلمة المرور', `<div class="fg"><div class="f full"><label for="pw_o">كلمة المرور الحالية</label><input id="pw_o" type="password" autocomplete="current-password"></div>
    <div class="f"><label for="pw_n">الجديدة</label><input id="pw_n" type="password" autocomplete="new-password"></div><div class="f"><label for="pw_n2">تأكيدها</label><input id="pw_n2" type="password" autocomplete="new-password"></div></div>
    <p style="margin:0;color:var(--muted);font-size:13px">يخرج كل من سجّل الدخول بكلمة المرور القديمة على الأجهزة الأخرى.</p>`,
    `<button class="btn pri" id="ok">حفظ</button><button class="btn" data-act="close">إلغاء</button>`);
  $('#ok').onclick = async () => {
    if (fval('pw_n') !== fval('pw_n2')) return toast('كلمتا المرور غير متطابقتين', 'bad');
    try { const r = await api('/password', {method:'POST', json:{old:fval('pw_o'), password:fval('pw_n')}}); token = r.token; store.set('mdr.token', token); closeModal(); toast('تغيّرت كلمة المرور'); } catch(e){ toast(errMsg(e), 'bad'); }
  };
}

/* ---------- teacher & parent portals ---------- */
const portalHead = (title, sub) => `<div class="brandbar"><div><span class="m">${set().region ? esc(set().region) + ' · ' : ''}${esc(school())}</span><h1>${esc(title)}</h1>${sub ? `<span class="m">${sub}</span>` : ''}</div>
  <div class="contact"><span class="k">مدير المدرسة</span><span>${esc(principal())}</span><span>${set().phone ? `<a class="phone" href="tel:${esc(set().phone)}">${esc(set().phone)}</a>` : ''}</span></div></div>`;
function renderTeacher(){
  const t = S.teachers[0]; if (!t) return;
  const ns = sortBy(S.notices, 'createdAt', -1), ex = [...S.exams].sort((a,b) => (a.date+a.period).localeCompare(b.date+b.period));
  const pend = ns.filter(n => n.status === 'issued').length + ex.filter(e => !e.recv || !e.ret).length;
  $('#gateRoot').innerHTML = `<div class="portal">${portalHead('الأستاذ/ ' + t.name, esc(t.specialty || ''))}
    ${pend ? `<div class="notice-bar">لديك ${pend} ${pend === 1 ? 'إجراء ينتظر' : 'إجراءات تنتظر'} توقيعك.</div>` : '<div class="done">لا يوجد ما ينتظر توقيعك. شكرًا لك.</div>'}
    <section class="panel"><h3>المساءلات</h3>${ns.length ? `<div class="list">${ns.map(n => { const [c,l] = nStatus(n); return `<div class="row"><div><div class="t">مساءلة رقم <span class="num">${esc(n.no)}</span> · ${esc(n.kind)}</div><div class="m">${esc(dayName(n.date))} ${esc(hij(n.date))}${n.decision ? ' · القرار: ' + esc(DECISIONS[n.decision]) : ''}</div></div><div class="tools"><span class="chip ${c}">${l}</span>${n.status === 'issued' ? `<button class="btn sm pri" data-act="reply" data-id="${n.id}">كتابة الإفادة والتوقيع</button>` : ''}<button class="btn sm" data-act="viewNotice" data-id="${n.id}">عرض</button></div></div>`; }).join('')}</div>` : '<div class="empty">لا توجد مساءلات عليك.</div>'}</section>
    <section class="panel"><h3>مظاريف الاختبارات</h3><p class="sub">وقّع عند استلام مظروف الأسئلة من الكنترول، ثم عند تسليم أوراق الإجابة.</p>${ex.length ? `<div class="list">${ex.map(e => `<div class="row"><div><div class="t">${esc(e.subject)} · ${esc(e.grade||'')}</div><div class="m">${esc(dayName(e.date))} ${esc(hij(e.date))} · الفترة ${esc(e.period||'')} · ${esc(committee(e.committeeId)?.name||'')}</div></div><div class="tools">
      ${e.recv ? '<span class="chip ok">استُلمت الأسئلة</span>' : `<button class="btn sm pri" data-act="envRecv" data-id="${e.id}">توقيع الاستلام</button>`}
      ${e.ret ? '<span class="chip ok">سُلّمت الإجابات</span>' : e.recv ? `<button class="btn sm pri" data-act="envRet" data-id="${e.id}">توقيع التسليم</button>` : ''}</div></div>`).join('')}</div>` : '<div class="empty">لم تُسند إليك ملاحظة اختبارات.</div>'}</section>
    <p class="m" style="color:var(--muted);font-size:12px;text-align:center">هذا رابطك الخاص؛ لا تشاركه مع غيرك.</p></div>`;
}
function renderParent(){
  const p = S.parents[0]; if (!p) return;
  $('#gateRoot').innerHTML = `<div class="portal">${portalHead(p.kind, 'ولي أمر الطالب/ ' + esc(p.student))}
    ${p.parentSig ? `<div class="done">تم التوقيع بتاريخ ${esc(stamp(p.parentSig.at))}. شكرًا لتعاونكم.</div>` : `<div class="notice-bar">اقرأ النموذج ثم اضغط «التوقيع» في أسفله.</div>`}
    ${parentDoc(p)}
    <div class="tools">${!p.parentSig ? `<button class="btn pri" data-act="signParent" data-id="${p.id}">التوقيع</button>` : ''}<button class="btn" data-act="printParent" data-id="${p.id}">طباعة / PDF</button></div></div>`;
}
async function startPortal(){
  gate('<p>جارٍ فتح النموذج…</p>');
  try {
    if (MODE === 'teacher') { const d = await api('/t/' + KEY); S.teachers = [d.teacher]; S.notices = d.notices; S.exams = d.exams; S.committees = d.committees; S.settings = d.settings; }
    else { const d = await api('/p/' + KEY); S.parents = [d.form]; S.settings = d.settings; }
    S.loaded = true; $('#gateRoot').innerHTML = ''; render();
  } catch(e){ gate(`<h1>تعذّر فتح الرابط</h1><p>${esc(errMsg(e))}</p><p>تواصل مع إدارة المدرسة للحصول على رابط صحيح.</p>`); }
}

function boot(){
  if (MODE !== 'admin') return startPortal();
  if (token) startAdmin(); else if (/[#&]key=/.test(location.hash) || store.get('mdr.newcode')) showRegister(); else showLogin();
}
boot();
})();
</script>
</body>
</html>
