<style>
/* Layout: a right-hand rail (school identity + sections) beside a working area; official forms render as white paper sheets signed in blue ink. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EEEC; --ink:#13201D; --muted:#5A6A65; --line:#D8E1DE;
  --accent:#0B6B55; --accent-ink:#FFFFFF; --accent-soft:#E1F0EA;
  --sig:#1D3F8F;
  --ok:#11703A; --ok-soft:#E3F3E8; --warn:#9A5700; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE7E4;
  --shadow:0 1px 2px rgba(19,32,29,.06),0 8px 24px rgba(19,32,29,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#15201D; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98A9A3; --line:#2A3934;
  --accent:#3DB592; --accent-ink:#04231B; --accent-soft:#16372E; --sig:#93B2FF;
  --ok:#5BD18B; --ok-soft:#143A24; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8C7C; --bad-soft:#401D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98A9A3; --line:#2A3934;
  --accent:#3DB592; --accent-ink:#04231B; --accent-soft:#16372E; --sig:#93B2FF;
  --ok:#5BD18B; --ok-soft:#143A24; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8C7C; --bad-soft:#401D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);padding-block:24px;padding-inline:18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand .logo{width:112px;background:#fff;border-radius:8px;padding:6px 8px;margin-bottom:6px}
.brand .logo img,.gate .logo img{display:block;width:100%;height:auto}
.gate .logo{width:120px;background:#fff;border-radius:8px;padding:6px 8px;align-self:center}
.brand h1{font-size:20px}
.brand .school{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 6px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
.who{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-block:14px 8px;flex-shrink:0;position:sticky;bottom:-24px;background:var(--surface);z-index:2}
.who b{color:var(--ink);font-weight:600}

.main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;min-width:0;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h2{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.wa{color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:16px}
.panel .sub{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .m{font-size:13px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--sunk);color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:10px 12px;background:var(--sunk);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.acts{white-space:nowrap}
.tbl td.acts .btn{margin-inline-start:4px}
.phone{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all}
.sigthumb{height:34px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 6px}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--warn);border-radius:5px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:end}

.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:14px}
.contact .k{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .t{font-weight:600}
.card .m{font-size:13px;color:var(--muted)}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.gd h3{margin:0}.gd .m{font-weight:400}
.gd-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.gd-goal{margin:0;line-height:1.8}
.gd-mem{display:flex;flex-wrap:wrap;gap:6px}.gd-mem .chip{background:var(--sunk);white-space:normal;font-weight:400}
.gd details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.gd-ol{margin:8px 0 0;padding-inline-start:22px;line-height:1.85}.gd-ol li{margin-bottom:4px}
.gd-roles{margin-bottom:12px}
.gd-tree{display:flex;flex-direction:column;align-items:center;gap:10px}
.gd-top{background:var(--accent);color:#fff;font-weight:700;padding:6px 18px;border-radius:8px}
.gd-units{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;width:100%}
.gd-unit{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--sunk)}.gd-unit ul{margin:6px 0 0;padding-inline-start:18px;font-size:13.5px;line-height:1.8}
.gd-dl{margin:0;display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px}.gd-dl dt{font-weight:700}.gd-dl dd{margin:0}
@media (max-width:560px){.gd-dl{grid-template-columns:1fr}.gd-dl dd{margin-bottom:6px}}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.notice-bar{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.notice-bar.info{background:var(--accent-soft);color:var(--accent)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,17,.45);display:grid;place-items:center;z-index:50;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);border-radius:14px;width:min(720px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dlg.wide{width:min(900px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h3{font-size:18px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lb{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{min-height:90px;resize:vertical;line-height:1.7}
.f .hint{font-size:12px;color:var(--muted)}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;max-height:230px;overflow:auto;background:var(--sunk);border-radius:8px;padding:10px}
.qgrid{min-width:640px}.qgrid td,.qgrid th{padding:4px;text-align:center}
.qc{all:unset;box-sizing:border-box;display:block;width:100%;min-width:62px;min-height:40px;line-height:1.25;padding:4px;border-radius:6px;background:var(--sunk);color:var(--muted);font-size:12px;cursor:pointer;text-align:center}
.qc.on{background:var(--accent-soft);color:var(--accent);font-weight:600}.qc.clash{background:var(--bad-soft);color:var(--bad)}
.sigbox{border:1.5px dashed var(--line);border-radius:10px;background:#FFFFFF;position:relative}
.sigbox canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigbox .ph{position:absolute;inset:auto 12px 10px auto;font-size:12px;color:#8A9893;pointer-events:none}
.sigbox .line{position:absolute;inset:auto 24px 34px 24px;border-top:1px solid #C9D3CF;pointer-events:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:860px){
  .app{display:block}
  .side{position:static;height:auto;border-inline-start:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;gap:14px}
  .nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .nav button{padding:8px 10px;font-size:14px}
  .who{position:static;margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-block:10px 0}.who .phone,.who .m{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fg{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav button{transition:background .15s,border-color .15s}}
</style>
<style id="docCss">
/* Official paper form: fixed white sheet in both themes, like the printed original. */
.paper{background:#fff;color:#111;border:1px solid #cfd6d3;border-radius:6px;padding:28px 30px;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:14.5px;line-height:1.9;direction:rtl;max-width:820px;margin:0 auto}
.paper .dh{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;border-bottom:2px solid #0B6B55;padding-bottom:10px;margin-bottom:10px;font-size:13px}
.paper .dh .lg img{height:68px;display:block}
.paper .dh .l{text-align:left}
.paper .dt{font-family:"Readex Pro",Tahoma,sans-serif;font-size:19px;font-weight:700;text-align:center;color:#0B6B55;line-height:1.4;margin:0 0 12px}
.paper .dt small{display:block;font-size:13px;color:#333;font-weight:500}
.paper h4{margin:16px 0 6px;font-size:14px;background:#EEF4F1;padding:4px 10px;border-radius:4px;color:#0B4D3E}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px}
.paper td,.paper th{border:1px solid #c9d1ce;padding:5px 8px;text-align:start}
.paper th{background:#F5F8F7;font-weight:600;width:22%}
.paper p{margin:6px 0}
.paper .sigrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;font-size:13px;align-items:end}
.paper .sigrow img{height:54px;max-width:100%;display:block}
.paper .sigrow .ln{border-bottom:1px dotted #888;min-height:56px;display:flex;align-items:flex-end}
.paper .opt{display:flex;gap:8px;align-items:flex-start}
.paper .box{display:inline-block;width:15px;height:15px;border:1.5px solid #333;border-radius:2px;flex:none;margin-top:6px;text-align:center;line-height:12px;font-size:12px;font-weight:700;color:#0B6B55}
.paper .foot{margin-top:18px;border-top:1px solid #ddd;padding-top:8px;font-size:11.5px;color:#555}
.paper .pend{color:#9A5700}
.batch>.paper+.paper{break-before:page;margin-top:18px}
.paper .ltr{direction:ltr;unicode-bidi:isolate}
.paper .pdfv img{display:block;width:100%;height:auto;border:1px solid #d5dcd9;margin:8px 0}
.paper .pdfv p{color:#666;font-size:13px}
.paper .pdfpg{position:relative;break-inside:avoid}
.paper .pdfsig{position:absolute;bottom:3.5%;width:30%;min-width:150px;background:rgba(255,255,255,.88);border:1px solid #9bb8ad;border-radius:6px;padding:4px 8px;text-align:center;font-size:11.5px;line-height:1.5}
.paper .pdfsig img{display:block;height:44px;max-width:100%;margin:2px auto;border:0}
.paper .pdfsig b,.paper .pdfsig span{display:block}
@media print{.paper .pdfv>img,.paper .pdfpg{break-inside:avoid;break-after:page}.paper .pdfv>img,.paper .pdfpg>img{width:auto;max-width:100%;max-height:262mm;margin:0 auto;border:0}.paper .pdfpg{width:fit-content;margin:0 auto}}
.paper .dots{color:#9aa3a0;letter-spacing:1px}
.paper .lines div{border-bottom:1px dotted #9aa3a0;height:28px}
.paper .sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:22px;font-size:13px;text-align:center}
.paper .sigs .s{display:flex;flex-direction:column;gap:4px}
.paper .sigs .s div{border-bottom:1px dotted #777;height:40px}
.paper .ltext{white-space:pre-wrap;line-height:2.1;font-size:15px}
.paper .lg{text-align:center;font-size:12px;margin:4px 0 8px}
.paper.land{max-width:1100px}
.paper table.sheet{table-layout:fixed;font-size:12.5px}
.paper table.sheet th,.paper table.sheet td{width:auto;text-align:center;height:30px;padding:2px 4px}
.paper table.sheet.sm th,.paper table.sheet.sm td{height:22px;font-size:11px}
.paper table.sheet .nm{width:13%;text-align:start}
.paper table.sheet .n{width:4%}
.paper table.sheet .rem{width:12%}
.paper table.sheet td.off{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:repeating-linear-gradient(45deg,#f2f2f2,#f2f2f2 4px,#e2e2e2 4px,#e2e2e2 8px)}
.paper table.sheet td.bx{font-size:17px;font-weight:700}
@media (max-width:600px){.paper{padding:18px 16px}.paper .dh{grid-template-columns:1fr;text-align:center}.paper .dh .l{text-align:center}.paper .dh .lg{order:-1;justify-self:center}.paper .sigrow{grid-template-columns:1fr}}
</style>
<style>
/* login and portal screens */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate .box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gate h1{font-size:22px}
.gate p{margin:0;color:var(--muted);font-size:14px}
.portal{max-width:860px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.portal .brandbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:12px}
.portal .brandbar h1{font-size:22px}
.portal .brandbar .m{color:var(--muted);font-size:13px}
.done{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:14px 16px;font-weight:600}
#printArea{display:none}
@media print{
  body{background:#fff}
  body.printing > *:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea .paper{border:0;max-width:none;padding:0}
  #printArea .paper.land{page:land}
  @page{size:A4;margin:12mm}
  @page land{size:A4 landscape;margin:10mm}
  html.portal body:not(.printing) > *{display:none!important}
}
</style>
</head>

<div id="gateRoot"></div>
<div class="app" id="appRoot" hidden>
  <aside class="side">
    <div class="brand">

      <span class="eyebrow" id="regionLine"></span>

</div>

function upsert(col, id, data, merge){
  if (col === 'settings') { S.settings = merge ? {...S.settings, ...data} : {...data}; return; }
  const arr = S[col]; if (!arr) return; const i = arr.findIndex(x => x.id === id);
  const doc = {...(merge && i >= 0 ? arr[i] : {}), ...data, id};
  if (i >= 0) arr[i] = doc; else arr.push(doc);
}

  fit();

  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => { down = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, 6.3); ctx.fillStyle='#1D3F8F'; ctx.fill(); pad.dirty = true; });

  pads[id] = pad;
}

function sha256hex(str){ const K = [], H = [], b = new TextEncoder().encode(str), l = b.length, n = ((l + 9 + 63) >> 6) << 4, w = new Uint32Array(n), W = new Uint32Array(64);

    for (let i = 0; i < 64; i++) { W[i] = i < 16 ? w[j + i] : (r(W[i-15], 7) ^ r(W[i-15], 18) ^ (W[i-15] >>> 3)) + W[i-7] + (r(W[i-2], 17) ^ r(W[i-2], 19) ^ (W[i-2] >>> 10)) + W[i-16] | 0;

    [a, bb, cc, d, e, f, g, h].forEach((v, i) => H[i] = H[i] + v | 0); }
  return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join(''); }

function stuStat(id){
  let days = 0, abs = 0, exc = 0, late = 0;
  S.attendance.forEach(d => { const v = d[id]; if (!v) return; days++; if (v === 'غياب بدون عذر') abs++; else if (v === 'غياب بعذر') exc++; else if (v === 'متأخر') late++; });
  const inc = S.incidents.filter(i => i.studentId === id);
  return {days, abs, exc, late, rate: days ? Math.round((days - abs - exc) / days * 100) : null, inc, maxDeg: inc.reduce((m,i) => Math.max(m, +i.deg || 0), 0)};
}
function atRisk(){
  const c = cfg();
  return S.students.map(s => { const st = stuStat(s.id), r = [];
    if (st.rate !== null && st.rate < 100 - c.absLimit) r.push(`نسبة الحضور ${st.rate}٪`);
    if (st.inc.length >= c.incLimit) r.push(`${st.inc.length} مخالفات`);
    if (st.maxDeg >= 4) r.push('مخالفة جسيمة');
    if (st.late >= 5) r.push(`تأخر ${st.late} مرات`);
    return {s, st, r}; }).filter(x => x.r.length).sort((a,b) => b.r.length - a.r.length);
}

/* ---------- متابعة الحصص ودخول المعلمين ---------- */
const DAYS5 = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const LMARK = [['دخل','✓'],['متأخر','⏱'],['لم يدخل','✗'],['غائب','غ']];
const wdOf = iso => Math.min(parseD(iso).getDay(), 4);
function lessonStat(tid){
  let n = 0, inn = 0, late = 0, miss = 0, abs = 0;
  S.lessons.forEach(d => Object.entries(d).forEach(([k,v]) => { if (k === 'id' || !v || v.t !== tid) return; if (v.s === 'غائب') { abs++; return; } n++; if (v.s === 'دخل') inn++; else if (v.s === 'متأخر') late++; else if (v.s === 'لم يدخل') miss++; }));
  return {n, inn, late, miss, abs, pct: n ? Math.round((inn + late * .5) / n * 100) : null};
}
function todayLessons(){
  const d = today(), L = S.lessons.find(x => x.id === d) || {};
  const marks = Object.entries(L).filter(([k,v]) => k !== 'id' && v && v.s);
  const ok = marks.filter(([,v]) => v.s !== 'لم يدخل' && v.s !== 'غائب').length;
  return {n: marks.length, miss: marks.length - ok, pct: marks.length ? Math.round(ok / marks.length * 100) : null};
}
function vSched(){
  const date = UI.schDate || today(), day = UI.schDay ?? wdOf(date), c = cfg();
  const rows = S.schedule.filter(e => +e.day === day).sort((a,b) => a.p - b.p);
  const L = S.lessons.find(x => x.id === date) || {};
  const done = rows.filter(e => L[e.id]?.s).length;

function canon(s){ s = String(s || '').trim();
  if (/لغتي|عربي|عربية|لغة عربية/.test(s)) return 'ar'; if (/علوم/.test(s)) return 'sci'; if (/رياض/.test(s)) return 'math';
  if (/إنجليز|انجليز/.test(s)) return 'eng'; if (/إسلام|اسلام|قرآن|توحيد|فقه/.test(s)) return 'isl'; if (/اجتماع/.test(s)) return 'soc'; return 'x_' + s; }
const sdist = (tc, rc) => tc === rc ? 0 : ((NEAR[rc] || []).indexOf(tc) + 1) || 50;
const graders = () => S.teachers.filter(t => !['كنترول','ملاحظ'].includes(t.ctrlRole));

function teacherSelBySpec(row, f){
  const rc = canon(row.subject), cur = row[f] || '';
  const groups = {0:[], 1:[], 2:[]}; graders().forEach(t => { const d = sdist(canon(t.specialty), rc); groups[d === 0 ? 0 : d < 50 ? 1 : 2].push(t); });
  const opt = t => `<option value="${t.id}" ${t.id === cur ? 'selected' : ''}>${esc(t.name)}${t.specialty ? ' — ' + esc(t.specialty) : ''}</option>`;
  return `<select data-gid="${row.id}" data-gf="${f}" aria-label="${GR_ROLE[f]}" ${isAdmin() ? '' : 'disabled'}><option value="">—</option>${cur && !teacher(cur) ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : ''}

}

// توزيع عادل: المصحح من نفس التخصص أو أقربه، والمراجع والمدقق بأقل عبء، ثم الملاحظون للاختبارات بلا ملاحظ
async function grAuto(){
  const el = graders(); if (!el.length) return toast('أضف المعلمين أولًا', 'bad');
  const load = Object.fromEntries(S.teachers.map(t => [t.id, 0]));
  const pickC = (subject, used) => { const rc = canon(subject); return el.filter(t => !used.has(t.id)).sort((a,b) => (sdist(canon(a.specialty), rc) - sdist(canon(b.specialty), rc)) || (load[a.id] - load[b.id]))[0]; };
  const pickB = (subject, used) => { const rc = canon(subject); return el.filter(t => !used.has(t.id)).sort((a,b) => (load[a.id] - load[b.id]) || (sdist(canon(a.specialty), rc) - sdist(canon(b.specialty), rc)))[0]; };
  const plan = [...S.grading].sort((a,b) => (a.order ?? 0) - (b.order ?? 0)).map(r => { const used = new Set(), u = {};
    for (const [f, pick] of [['corrector', pickC], ['reviewer', pickB], ['auditor', pickB]]) { const t = pick(r.subject, used); u[f] = t ? t.id : ''; if (t) { used.add(t.id); load[t.id]++; } }
    return [r.id, u]; });
  S.exams.forEach(e => { if (e.observerId && load[e.observerId] !== undefined) load[e.observerId]++; });
  const obs = S.exams.filter(e => !e.observerId).map(e => { const t = [...S.teachers].sort((a,b) => load[a.id] - load[b.id])[0]; if (t) load[t.id]++; return [e.id, t?.id]; }).filter(x => x[1]);
  confirmBox('توزيع تلقائي', `سيُوزَّع التصحيح والمراجعة والتدقيق لـ ${plan.length} مادة${obs.length ? ` والملاحظة لـ ${obs.length} اختبار بلا ملاحظ` : ''} بالعدل بين ${el.length} معلمًا مع مراعاة التخصص. يُستبدل التوزيع الحالي.`, 'توزيع', async () => {
    for (const [id, u] of plan) await put('grading/' + id, u, true);
    for (const [id, tid] of obs) await put('exams/' + id, {observerId:tid}, true);
    toast('تم التوزيع');
  });
}

    `<div class="seg" role="group" aria-label="أقسام المحاضر">${seg}</div>` + body;

تم رصد بعض الملاحظات خلال الأسبوع الماضي، لذا يجب على الجميع مراعاة ما يلي:

• الدخول والخروج من الحصص في وقتها المحدد، وتحمّل المسؤولية كاملة في حال حدوث أي مشكلة أثناء غياب المعلم عن الفصل.
• عدم تعنيف الطلاب سواء بالضرب أو التأنيب أو الصراخ، واستخدام الأساليب التربوية لمعالجة قضايا الطلاب.
• عدم السماح لأي ولي أمر بالدخول للصف نهائيًا، وإعادته لمراجعة إدارة المدرسة.
• عدم السماح لأكثر من طالب بالخروج من الصف في نفس الوقت.
• عدم تسريح الطلاب قبل جرس نهاية الحصة، وعدم إخراج الطالب من الفصل عقوبةً له.
• عدم ترك الطلاب دون إشراف مطلقًا، وعند الضرورة القصوى يُبلَّغ المعلم المناوب أو الإدارة.
• رصد حضور الطلاب وغيابهم في الحصة الأولى وتوثيقه في النظام، والإبلاغ عن أي غياب طارئ.
• عدم استخدام الجوال أو استقبال الزيارات أو مغادرة الفصل لأي غرض شخصي أثناء الحصة.
• الالتزام بالتحضير المسبق وتفعيل الوسائل والأنشطة الصفية طوال زمن الحصة.
• عدم تكليف الطلاب بمهام خارج الفصل أثناء وقت الحصة.
• التأكد من نظافة الفصل وسلامة أثاثه ومحتوياته قبل الخروج، وتسليم الطلاب لمعلم الحصة التالية.
• الاستئذان المسبق عن أي غياب أو تأخر متوقع، وتسليم خطة الحصة وأوراق العمل لمعلم الاحتياط.

الموضوع: تعليمات المناوبة اليومية ومهام المعلم المناوب

نظرًا لأهمية المناوبة في انضباط المدرسة وسلامة الطلاب، نأمل من المعلم المناوب الالتزام بما يلي:

أولًا: قبل بدء الدوام
• الحضور قبل بدء الدوام الرسمي بمدة لا تقل عن (١٥) دقيقة والتوقيع في سجل المناوبة.
• استقبال الطلاب عند البوابة، ومنع دخول أي شخص غير منسوبي المدرسة إلا بإذن الإدارة.
• الإشراف على الاصطفاف الصباحي وتنظيم الطابور ومتابعة النشاط الصباحي.
• تسجيل أسماء الطلاب المتأخرين ورفعها للإدارة.

ثانيًا: أثناء الحصص
• متابعة دخول المعلمين لحصصهم فور الجرس، وتبليغ الإدارة فورًا عن أي تأخر أو عدم دخول.
• تغطية حصص المعلمين الغائبين بالتنسيق مع وكيل الشؤون التعليمية وتوزيع معلمي الاحتياط.
• الجولة الدورية على الممرات ودورات المياه والمقصف والفناء أثناء الحصص.
• عدم السماح لأي طالب بالتجول خارج الفصل دون إذن، وإعادته لفصله.
• استقبال أولياء الأمور وتوجيههم للإدارة، وعدم السماح بالدخول إلى الفصول نهائيًا.

ثالثًا: الفسحة والانصراف
• الإشراف المباشر على الفسحة ومتابعة سلامة الطلاب ونظام المقصف.
• منع خروج أي طالب من المدرسة إلا بإذن رسمي موثّق من الإدارة وبحضور ولي أمره.
• تنظيم الانصراف ومتابعة صعود الطلاب للحافلات حتى خروج آخر طالب.

رابعًا: الحالات الطارئة
• التعامل الفوري مع الإصابات والحالات الصحية وإبلاغ الإدارة وولي الأمر، وتوثيق الحالة كتابيًا.
• الإبلاغ الفوري عن أي خطر في المرافق أو الأجهزة أو الكهرباء.
• عدم التصرف منفردًا في القضايا السلوكية الجسيمة، وإحالتها للإدارة والمرشد الطلابي.

خامسًا: التوثيق
• تعبئة نموذج تقرير المناوبة اليومي وتسليمه للإدارة قبل نهاية الدوام.

انطلاقًا من حرص المدرسة على استثمار زمن الحصة الدراسية، وحفاظًا على انضباط البيئة التعليمية وسلامة الطلاب، نأمل من الجميع التقيد بما يلي:

٢. عدم مغادرة الفصل قبل جرس نهاية الحصة، وعدم تسريح الطلاب مبكرًا لأي سبب.
٣. عدم ترك الطلاب دون إشراف مطلقًا؛ وعند الضرورة القصوى يُبلَّغ وكيل المدرسة أو المدير قبل المغادرة.
٤. الاستئذان المسبق كتابيًا لأي غياب أو تأخر متوقع، مع تسليم خطة الحصة لمعلم الاحتياط.
٥. الالتزام بجدول الحصص المعتمد، وعدم تبادل الحصص بين المعلمين إلا بموافقة إدارة المدرسة.
٦. عدم استقبال الزيارات أو إجراء المكالمات أثناء الحصة.
٧. تفعيل الحصة من بدايتها حتى نهايتها بما يحقق أهداف الدرس، وتسليم الطلاب لمعلم الحصة التالية.

وتفيدكم الإدارة بأن دخول الحصص يُرصد يوميًا وفق نموذج المتابعة المعتمد، وأن ما يُرصد من مخالفات يُعالج بالإجراءات النظامية المتدرجة، ويُعد ضمن عناصر تقويم الأداء الوظيفي.

شاكرين لكم جهودكم وتعاونكم،

مدير المدرسة/ ${d.pr}
التوقيع: ______________

نسخة لـ: ملف التعاميم — لوحة إعلانات غرفة المعلمين — الوكلاء`,

 'تعليمات دخول الحصص (كاملة)':d=>`${d.school}
تعليمات تنظيم دخول الحصص ومتابعتها
العام الدراسي ${d.year}                    تاريخ الاعتماد: ${d.date}

أولًا: الهدف والنطاق
١. تنظيم دخول المعلمين لحصصهم وضمان عدم إهدار زمن الحصة.
٢. تسري هذه التعليمات على جميع أعضاء الهيئة التعليمية دون استثناء، وعلى جميع الحصص بما فيها حصص الانتظار والنشاط.

ثانيًا: مواعيد الحصص
٣. يبدأ زمن الحصة من جرس البداية وينتهي بجرس النهاية، ويُعد المعلم متأخرًا إذا لم يدخل خلال (٣) دقائق من الجرس.
٤. يُعد المعلم غير منفذ للحصة إذا لم يدخل الفصل خلال (١٠) دقائق دون عذر مقبول.
٥. زمن الانتقال بين الفصول جزء من مسؤولية المعلم، ولا يُقبل الاعتذار بالتأخر بسبب البُعد إلا في الحالات المعتمدة من الإدارة.

ثالثًا: آلية الدخول والخروج
٦. يستقبل المعلم طلابه عند باب الفصل ويتأكد من انتظامهم قبل بدء الدرس.
٧. يتحقق المعلم من حضور الطلاب ويرصده في الحصة الأولى ويبلغ عن أي غياب طارئ.
٨. لا يُسمح بإخراج الطالب من الحصة عقوبةً؛ وتُعالج المخالفات وفق لائحة السلوك والمواظبة.
٩. لا يغادر المعلم الفصل إلا بعد جرس النهاية وتسليم الطلاب للحصة التالية.

رابعًا: الاستئذان والاحتياط
١٠. يُقدَّم طلب الاستئذان قبل يوم عمل واحد على الأقل، عدا الحالات الطارئة فيُبلَّغ فورًا هاتفيًا.
١١. على المعلم المستأذن تسليم خطة الحصة وأوراق العمل لوكيل الشؤون التعليمية.
١٢. يلتزم معلم الاحتياط بتنفيذ الحصة كاملة وفق الخطة المسلّمة، لا بمجرد الإشراف على الطلاب.
١٣. لا يُعد إبلاغ الزميل بديلًا عن إبلاغ الإدارة رسميًا.

خامسًا: المتابعة والرصد
١٤. تتولى إدارة المدرسة الرصد اليومي لدخول الحصص عبر نموذج المتابعة المعتمد (دخل / متأخر / لم يدخل).
١٥. يُحتسب لكل معلم مؤشر التزام تراكمي طوال الفصل الدراسي، ويُطلع عليه المعلم عند طلبه.
١٦. تُعرض نتائج الالتزام في تقرير أسبوعي داخلي، ويُوثَّق ملخصها في ملف الأداء.

سادسًا: الإجراءات المتدرجة عند المخالفة
١٧. المخالفة الأولى: توجيه شفهي موثّق من مدير المدرسة.
١٨. المخالفة الثانية: خطاب مساءلة خطي يُجاب عنه خلال ثلاثة أيام عمل.
١٩. المخالفة الثالثة: لفت نظر خطي يُودع في ملف المعلم.
٢٠. التكرار بعد ذلك: إحالة الموضوع لإدارة التعليم وفق الأنظمة واللوائح المعتمدة.
٢١. لا يُنتقل إلى إجراء لاحق دون توثيق ما قبله، ويُمنح المعلم حق الرد قبل أي إجراء.

سابعًا: الأعذار المقبولة
٢٢. تُقبل الأعذار الطارئة الموثقة (الحالات الصحية، التكليف الرسمي، أمر إداري من الإدارة)، ويُثبت العذر في السجل ولا يُحتسب مخالفة.
٢٣. تكرار الأعذار غير الموثقة يُعامل معاملة المخالفة.

ثامنًا: التحفيز
٢٤. يُكرَّم المعلمون الحاصلون على التزام (١٠٠٪) في نهاية كل فصل دراسي بخطاب شكر يُودع في ملفاتهم.

تاسعًا: السريان
٢٥. يُعمل بهذه التعليمات اعتبارًا من تاريخ اعتمادها، ويُلغى ما يتعارض معها.
٢٦. مسؤولية تنفيذ هذه التعليمات تقع على وكيل الشؤون التعليمية بإشراف مدير المدرسة.

let xlsxReady = null;
function loadXlsx(){ return xlsxReady ||= new Promise((ok, no) => { if (window.XLSX) return ok(window.XLSX);
  const s = document.createElement('script'); s.src = 'vendor/xlsx.full.min.js'; s.onload = () => ok(window.XLSX);
  s.onerror = () => { xlsxReady = null; no({message:'تعذّر تحميل أداة Excel. تحقق من الإنترنت ثم أعد المحاولة.'}); }; document.head.appendChild(s); }); }
async function saveXlsx(name, sheets){
  try { const X = await loadXlsx(); const wb = X.utils.book_new(); wb.Workbook = {Views:[{RTL:true}]};
    sheets.forEach(({name:n, rows}) => { const ws = X.utils.aoa_to_sheet(rows);
      ws['!cols'] = rows[0].map((_,c) => ({wch:Math.min(38, Math.max(7, ...rows.slice(0,200).map(r => String(r[c] ?? '').length + 2)))}));
      X.utils.book_append_sheet(wb, ws, n.slice(0,31)); });
    saveBlob(name + '.xlsx', X.write(wb, {type:'array', bookType:'xlsx'}), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  } catch(e){ toast(errMsg(e), 'bad'); }
}
async function readBook(file){
  const X = await loadXlsx();
  const wb = X.read(await file.arrayBuffer(), {type:'array', ...(/\.csv$/i.test(file.name) ? {codepage:65001} : {})});
  return wb.SheetNames.map(n => ({name:n, rows:X.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:'', blankrows:false})}));
}
const digits = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

// تحديد معنى كل عمود من عنوانه، فيقبل ملف نور أو ملف المنصة أو أي ملف بعناوين مقاربة
function stuColOf(h){ const c = normAr(h); if (!c || c.length > 40 || /تاريخ|قريب/.test(c)) return '';
  if (/واتس|whatsapp/i.test(c)) return 'wa';
  if (/جوال|هاتف|موبايل|تواصل|mobile|phone/i.test(c)) return 'phone';
  if (/ولي/.test(c)) return /هويه|سجل/.test(c) ? '' : 'guard';
  if (/هويه|سجل مدني|السجل المدني|اقامه|رقم الطالب/.test(c)) return 'nid';
  if (/اسم الطالب|^الاسم|^اسم$|^الطالب$/.test(c)) return 'name';
  if (/^الصف|^المرحله|^المستوي/.test(c)) return 'grade';
  if (/^الفصل|^الشعبه/.test(c)) return 'cls';
  if (/^ملاحظ/.test(c)) return 'note'; return ''; }
function stuHeader(row){ const map = {}; row.forEach((v,i) => { const k = stuColOf(v); if (!k) return; if (!(k in map) || (k === 'phone' && /ولي/.test(normAr(v)))) map[k] = i; }); return map; }
// ملف بلا عناوين: يُستدل على الأعمدة من محتواها
function guessCols(rows){ const n = Math.max(...rows.slice(0,60).map(r => r.length)); const map = {};
  for (let c = 0; c < n; c++) { const vals = rows.slice(0,60).map(r => cellStr(r[c])).filter(Boolean); if (!vals.length) continue;
    const share = re => vals.filter(v => re.test(digits(v))).length / vals.length;
    if (!('name' in map) && share(/^[\u0621-\u064A]+( [\u0621-\u064A]+){2,}$/) > .6) map.name = c;
    else if (!('phone' in map) && share(/^(00966|966|0)?5\d{8}$/) > .6) map.phone = c;
    else if (!('nid' in map) && share(/^[12]\d{9}$/) > .6) map.nid = c; }
  return map; }
function parseStudents(sheets, defaults){
  const out = [], found = new Set(); const after = (s, k) => (s.match(new RegExp(k + '\\s*[:：/-]?\\s*([^\\s:：]+)')) || [])[1] || '';
  sheets.filter(x => !/^(الغياب|السلوك)/.test(x.name)).forEach(({name:sheet, rows}) => {
    let hi = -1, map = {}, best = 0;
    rows.slice(0,40).forEach((r,i) => { const m = stuHeader(r); const n = Object.keys(m).length; if (m.name !== undefined && n > best) { best = n; hi = i; map = m; } });
    if (hi < 0) { map = guessCols(rows); if (map.name === undefined) return; }
    Object.keys(map).forEach(k => found.add(k));
    let grade = '', cls = '';
    const scan = r => { const cs = r.map(cellStr).filter(v => v && !/^[:：]$/.test(v)), lb = cs.findIndex(v => /^(الصف|الفصل)\s*[:：]?$/.test(v));
      if (lb >= 0 && cs.length === 2) { const v = cs[1 - lb]; if (/الصف/.test(cs[lb])) grade = v; else cls = v; return; }
      const t = cs.join(' '), g = after(t, 'الصف'), c = after(t, 'الفصل'); if (g) grade = g; if (c) cls = c; };
    rows.slice(0, Math.max(hi, 0)).forEach(scan); if (!grade && /الصف/.test(sheet)) scan([sheet]);
    rows.slice(hi + 1).forEach(r => {
      const name = cellStr(r[map.name]); const rh = stuHeader(r);
      if (rh.name !== undefined && Object.keys(rh).length >= 2) return;
      if (r.some(v => /^(الصف|الفصل)\s*[:：]/.test(cellStr(v)))) return scan(r);
      if (!name || !/[ء-ي]{2}/.test(name) || /مجموع|الاجمالي|الإجمالي|عدد الطلاب/.test(name)) return;
      const g = k => map[k] === undefined ? '' : cellStr(r[map[k]]);
      out.push({name, nid:digits(g('nid')).replace(/\D/g,''), grade:g('grade') || grade || defaults.grade || '', cls:g('cls') || cls || defaults.cls || '', guard:g('guard'), phone:cleanPhone(g('phone')), wa:cleanPhone(g('wa')), note:g('note')});
    });
  });
  return {rows:out, found};
}
// يضيف الجديد ويحدّث الموجود بالخانات غير الفارغة فقط؛ لا يحذف طالبًا ولا يغيّر معرّفه فيبقى سجله
function planStudents(rows){
  const nameKey = r => normAr(r.name) + '|' + normAr(r.grade) + '|' + normAr(r.cls);
  const byNid = new Map(), byKey = new Map(), byName = new Map();
  S.students.forEach(s => { if (s.nid) byNid.set(s.nid, s); byKey.set(nameKey(s), s); const k = normAr(s.name); byName.set(k, byName.has(k) ? null : s); });
  const seen = new Set(), add = [], upd = []; let same = 0, dup = 0;
  rows.forEach(r => { const k = r.nid || nameKey(r); if (seen.has(k)) { dup++; return; } seen.add(k);
    const hit = (r.nid && byNid.get(r.nid)) || byKey.get(nameKey(r)) || byName.get(normAr(r.name));
    if (!hit) return add.push({id:newId(), ...r, createdAt:Date.now()});
    const ch = {}; ['nid','grade','cls','guard','phone','wa','note'].forEach(f => { if (r[f] && r[f] !== hit[f]) ch[f] = r[f]; });
    if (Object.keys(ch).length) upd.push({...hit, ...ch}); else same++; });
  return {add, upd, same, dup};
}
async function bulkPut(col, docs, dels){
  for (let i = 0; i < docs.length; i += 100) await api('/bulk/' + col, {method:'POST', json:{docs:docs.slice(i, i + 100)}});
  for (let i = 0; i < (dels || []).length; i += 100) await api('/bulk/' + col, {method:'POST', json:{del:dels.slice(i, i + 100)}});
  docs.forEach(({id, ...d}) => upsert(col, id, d)); if (dels?.length) S[col] = S[col].filter(x => !dels.includes(x.id)); render();
}

function parseTeachers(sheets){ const out = [];

    rows.slice(0, 30).forEach((r, i) => { if (hi >= 0) return; const m = {}; r.forEach((v, j) => { const k = tColOf(cellStr(v)); if (k && !(k in m)) m[k] = j; }); if (m.name !== undefined && Object.keys(m).length >= 2) { hi = i; map = m; } });

      for (let c = 0; c < n; c++) { const v = rows.slice(0, 60).map(r => cellStr(r[c])).filter(Boolean); if (!v.length) continue; const sh = f => v.filter(f).length / v.length, dg = x => digits(x).replace(/\D/g, '');

      if (!name || !/[ء-ي]{2}/.test(name) || /مجموع|الاجمالي|الإجمالي|^اسم /.test(name) || tColOf(name) === 'name') return;

// الجديد يُضاف برابطه، والموجود (بالسجل أو الاسم) تُحدَّث خاناته غير الفارغة؛ لا يُحذف أحد
function planTeachers(rows){ const byNid = new Map(), byName = new Map(), seen = new Set(), add = [], upd = []; let same = 0, dup = 0;
  S.teachers.forEach(t => { if (t.nid) byNid.set(t.nid, t); byName.set(normAr(t.name), t); });
  rows.forEach(r => { const k = r.nid || normAr(r.name); if (seen.has(k)) { dup++; return; } seen.add(k);

// الغائب: من سُجّل غيابه، أو له إجازة معتمدة، أو رُصد «غائب» في إحدى حصصه
function absentOn(date){ const a = new Set(S.absences.filter(x => x.date === date && x.type === 'غياب').map(x => x.teacherId));
  S.leaves.filter(l => l.status === 'approved' && l.kind !== 'استئذان' && l.from <= date && (l.to || l.from) >= date).forEach(l => a.add(l.teacherId));
  Object.values(S.lessons.find(x => x.id === date) || {}).forEach(v => { if (v && v.s === 'غائب' && v.t) a.add(v.t); }); a.delete(undefined); return a; }
const subKey = (date, eid) => (date + '_' + eid).slice(0, 64);
const subOf = (date, e) => S.subs.find(x => x.id === subKey(date, e.id));
// المقترحون: الحاضرون الفارغون في الحصة، الأقل انتظارًا هذا الشهر ثم الأقل حصصًا ذلك اليوم ثم الأقل نصابًا
function subCands(date, e){ const day = wdOf(date), ab = absentOn(date), m = date.slice(0, 7);
  const busy = new Set(S.schedule.filter(x => +x.day === day && +x.p === +e.p).map(x => x.tid)); S.subs.filter(x => x.date === date && +x.p === +e.p && x.entryId !== e.id).forEach(x => busy.add(x.subId));

/* ===================== الطلبة المتجاوزون لنسبة الغياب ١٠٪ ===================== */

const AP_STEPS = [
  ['إطلاع الطالب وولي أمره على قواعد السلوك والمواظبة، وأخذ توقيعهم على ذلك', 'نموذج الالتزام المدرسي'],
  ['الإشعار اليومي لولي الأمر بغياب الطالب', 'قنوات التواصل الرقمي: الرسائل النصية، الواتساب، البريد، الاتصال'],
  ['إحالة الطالب إلى الموجه الطلابي لدراسة حالته', 'نموذج إحالة'],
  ['استدعاء ولي الأمر، وتنبيهه بالإجراءات المترتبة على استمرار الغياب', 'نموذج استدعاء ولي الأمر'],
  ['أخذ التعهد الخطي من الطالب وولي الأمر بالالتزام بالخطة التربوية والعلاجية المقدمة', 'نموذج تعهد خطي'],
  ['إحالة الطالب إلى لجنة التوجيه الطلابي لمراجعة الخطة التربوية والعلاجية المقدمة للطالب', 'نموذج محضر لجنة التوجيه'],
  ['مخاطبة ذات الاختصاص حيال تطبيق ما ورد في نظام حماية الطفل ونظام الحماية من الإيذاء', 'نموذج التحويل لحماية الطفل'],
  ['متابعة الإجراءات والتنسيق من قبل المدرسة بعد اتخاذ الإجراءات النظامية المطلوبة مع الجهات ذات الاختصاص', 'نموذج إحالة']];
const apDays = () => +set().yearDays || 180;
const apLimit = () => Math.ceil(apDays() * 0.1);
const apRec = id => S.absproc.find(x => x.id === id) || {steps:{}};
const apDone = id => AP_STEPS.filter((_, i) => apRec(id).steps?.[i + 1]).length;
const apRate = id => Math.round(apDone(id) / AP_STEPS.length * 100);
// الغياب بلا عذر هو المعتبر في النسبة، ويظهر الغياب بعذر للاطلاع
function apList(){ const lim = apLimit();
  return S.students.map(s => ({s, st:stuStat(s.id)})).filter(x => x.st.abs >= Math.ceil(lim / 2) || S.absproc.some(a => a.id === x.s.id))
    .map(x => ({...x, over:x.st.abs >= lim})).sort((a, b) => b.st.abs - a.st.abs); }
function vAbs10(){ const lim = apLimit(), list = apList(), over = list.filter(x => x.over), near = list.filter(x => !x.over);
  const row = x => { const r = apRate(x.s.id);
    return `<tr><td><b>${esc(x.s.name)}</b><div style="font-size:12px;color:var(--muted)">${esc(sClass(x.s))}</div></td><td class="num">${x.st.abs}</td><td class="num">${x.st.exc}</td><td class="num">${Math.round(x.st.abs / apDays() * 1000) / 10}٪</td>
      <td><span class="chip ${r === 100 ? 'ok' : r >= 50 ? 'warn' : 'bad'} num">${apDone(x.s.id)} من ٨ · ${r}٪</span></td><td>${r === 100 ? '<span class="chip ok">ملتزمة</span>' : x.over ? '<span class="chip bad">تحتاج إجراء إداري</span>' : '<span class="chip info">متابعة</span>'}</td>
      <td>${isAdmin() ? `<button class="btn sm pri" data-act="apOpen" data-id="${x.s.id}">الإجراءات والنماذج</button>` : ''}</td></tr>`; };
  const tbl = (t, l, empty) => `<section class="panel"><h3>${t}</h3>${l.length ? `<div class="tablewrap"><table class="tbl"><thead><tr><th>الطالب</th><th>غياب بلا عذر</th><th>غياب بعذر</th><th>النسبة من العام</th><th>الإجراءات المنفذة</th><th>الحالة</th><th></th></tr></thead><tbody>${l.map(row).join('')}</tbody></table></div>` : `<div class="empty">${empty}</div>`}</section>`;
  return `<div class="notice-bar info">نسبة ١٠٪ من أيام العام الدراسي (${apDays()} يومًا) = <b>${lim} يومًا</b> غياب بلا عذر. لكل طالب متجاوز ثمانية إجراءات نظامية، تسجّل تنفيذها وتطبع نموذجها من «الإجراءات والنماذج». عدد أيام العام يُعدّل من الإعدادات.</div>
    ${tbl(`المتجاوزون لنسبة الغياب (${over.length})`, over, 'لا يوجد طالب تجاوز نسبة الغياب حتى الآن.')}
    ${tbl(`يقتربون من النسبة: ${Math.ceil(lim / 2)} أيام فأكثر (${near.length})`, near, 'لا يوجد.')}`; }
function apForm(id){ const s = student(id); if (!s) return; const r = apRec(id), st = stuStat(id), wl = waLink(stuWa(s), waNote(s, 'إشعار بغياب الطالب', `بلغ غياب ابنكم بلا عذر ${st.abs} يومًا، وهذا يتجاوز نسبة ١٠٪ المسموح بها من أيام العام الدراسي. نأمل متابعة انتظامه، والتواصل مع المدرسة.`));

        <div class="tools"><input id="ap_d${k}" type="date" value="${esc(d)}" aria-label="تاريخ تنفيذ الإجراء ${k}">${k === 2 && wl ? `<a class="btn sm wa" href="${esc(wl)}" target="_blank" rel="noopener">إشعار واتساب</a>` : ''}${AP_DOC[k] ? `<button class="btn sm" data-act="apPrint" data-id="${id}" data-k="${k}">طباعة النموذج</button>` : ''}</div></div>`; }).join('')}</div>

    <div class="f full" style="margin-top:8px"><label for="ap_n">ملاحظات</label><input id="ap_n" value="${esc(r.note || '')}"></div>`,
    `<button class="btn pri" id="ok">حفظ</button><button class="btn" data-act="close">إغلاق</button>`, true);

const PDF_OV = new Map();

const pdfCache = new Map();
// تُرسم الصفحات صورًا (حتى ٣٠ صفحة) وتُحفظ لتُعاد في الطباعة والتنزيل
const pdfImgs = id => { if (!pdfCache.has(id)) pdfCache.set(id, (async () => { const pdfjs = await loadPdf(), r = await fetch(fileUrl(id)); if (!r.ok) throw new Error('file');
    const doc = await pdfjs.getDocument({data:await r.arrayBuffer()}).promise, pages = [];
    for (let i = 1; i <= Math.min(doc.numPages, 30); i++) { const pg = await doc.getPage(i), w0 = pg.getViewport({scale:1}).width, v = pg.getViewport({scale:Math.min(2, 1100 / w0)}), c = document.createElement('canvas'); c.width = Math.round(v.width); c.height = Math.round(v.height);
      const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); await pg.render({canvasContext:cx, viewport:v}).promise; pages.push(c.toDataURL('image/jpeg', .82)); c.width = 0; }
    return {pages, total:doc.numPages}; })().catch(e => { pdfCache.delete(id); throw e; })); return pdfCache.get(id); };

const pdfOv = ov => `<div class="pdfsig" style="${ov.pos === 'center' ? 'left:50%;transform:translateX(-50%)' : ov.pos === 'right' ? 'right:6%' : 'left:6%'}"><b>${esc(ov.label)}: ${esc(ov.sig.name || '')}</b><img src="${esc(ov.sig.img)}" alt="توقيع ${esc(ov.sig.name || '')}"><span>${esc(stamp(ov.sig.at))}</span></div>`;
const pdfHtml = (d, ov) => d.pages.map((u, i) => i === d.pages.length - 1 && ov ? `<div class="pdfpg"><img src="${u}" alt="صفحة ${i + 1} من المستند">${pdfOv(ov)}</div>` : `<img src="${u}" alt="صفحة ${i + 1} من المستند">`).join('') + (d.total > d.pages.length ? `<p>تظهر أول ${d.pages.length} صفحة من ${d.total}، والملف كاملًا من رابط الملف الأصلي.</p>` : '');

async function pdfInline(html){ const hits = [...new Set([...html.matchAll(/<div class="pdfv" data-pdf="([^"]+)"(?: data-ov="([^"]+)")?><\/div>/g)].map(m => m[0]))];

/* ---------- قراءة الخطة التشغيلية من PDF ---------- */
// نسخة pdf.js في vendor معدّلة لتصحيح ترتيب الحروف المتصلة العربية (لا، لأ، لم) عند استخراج النص
let pdfReady;
const loadPdf = () => pdfReady ||= import(new URL('vendor/pdf.min.mjs', location.href).href).then(m => { m.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.mjs', location.href).href; return m; });
const latinDig = s => String(s || '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
const pnorm = s => String(s || '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[\sـ:]/g, '');
const PCOLS = {kind:['النوع','نوعالبرنامج','التصنيف'], no:['م','رقم'], name:['اسمالبرنامج','البرنامج','اسمالمبادره','المبادره','البرامج','الاجراء','الاجراءات','النشاط'], sem:['الفصل','الفصلالدراسي'], week:['الاسبوع'],
  when:['زمنالتنفيذ','موعدالتنفيذ','التوقيت','وقتالتنفيذ','مدهالتنفيذ','الفترهالزمنيه'], targets:['المستهدفون','المستهدفين','الفئهالمستهدفه'], req:['ماليه','غير','غيرماليه','المتطلبات'],
  method:['اسلوب','اسلوبالتنفيذ','التنفيذ','اليهالتنفيذ','اساليبالتنفيذ'], owner:['رئيس','مسؤولالتنفيذ','المسؤول','المسؤولعنالتنفيذ','المنفذ','جههالتنفيذ'], helper:['مساند','المساند'], kpi:['مؤشرالانجاز','مؤشرالاداء','مؤشراتالانجاز','مؤشراتالاداء','مؤشرالتحقق']};
const pfield = s => { const n = pnorm(s); for (const [f, l] of Object.entries(PCOLS)) if (l.includes(n)) return f; return ''; };
// يجمع عناصر السطر من اليمين لليسار، ويضع الأرقام المتجاورة بترتيبها الصحيح
function pline(items){
  const a = [...items].sort((x, y) => y.x - x.x), out = [];
  for (let i = 0; i < a.length; i++) {
    if (/^\d+$/.test(latinDig(a[i].s.trim()))) { let j = i; while (j + 1 < a.length && /^\d+$/.test(latinDig(a[j + 1].s.trim())) && a[j].x - (a[j + 1].x + a[j + 1].w) < 2) j++;
      out.push({s:a.slice(i, j + 1).reverse().map(x => x.s.trim()).join(''), x:a[j].x, w:a[i].x + a[i].w - a[j].x, sp:a[i].sp}); i = j; } else out.push(a[i]); }
  return out.reduce((t, x, i) => t + (i && (x.sp || out[i - 1].sp || out[i - 1].x - (x.x + x.w) > 2.5) ? ' ' : '') + x.s.trim(), '');
}
function ptext(items){
  const rows = []; [...items].sort((a, b) => a.y - b.y).forEach(it => { const r = rows.find(r => Math.abs(r.y - it.y) <= 3.5); r ? r.items.push(it) : rows.push({y:it.y, items:[it]}); });
  return ptidy(rows.map(r => pline(r.items)).join(' '));
}
// تصحيح ما يفقده استخراج النص من مسافات: كلمتان ملتصقتان قبل «ال»، والأرقام الملتصقة، والحروف المنفصلة والتنوين
const ptidy = s => s.replace(/\s+/g, ' ').replace(/(^|\s)[ً-ٟ](?=\s|$)/g, '$1').replace(/\s+([ً-ٟ])/g, '$1')
  .replace(/([ء-ي]{3,})(ال[ء-ي]{3,})/g, (m, a, b) => /^(وال|بال|فال|كال|لل|وبال|ولل|فلل)/.test(a + b) && a.length < 4 ? m : a + ' ' + b)
  .replace(/([ء-ي]) ([ء-هى-ي])(?=[\s.,،:]|$)/g, '$1$2')
  .replace(/([ء-ي])([0-9٠-٩])/g, '$1 $2').replace(/([0-9٠-٩])([ء-ي])/g, '$1 $2').replace(/([0-9٠-٩]) %/g, '$1%').replace(/\s+/g, ' ').trim();
function pageItems(tc, vp){
  const out = []; let prev = null;
  for (const it of tc.items) { if (!('str' in it)) continue;
    if (!it.str.trim()) { if (prev) prev.sp = true; continue; }
    prev = {s:it.str.normalize('NFKC'), x:it.transform[4], y:vp.height - it.transform[5], w:it.width}; out.push(prev); }
  return out;
}
function planTables(items){
  // رأس الجدول: خانة «اسم البرنامج» ومعها ثلاث خانات رأس أخرى على الأقل في السطر نفسه
  const heads = items.filter(i => pfield(i.s) === 'name' && new Set(items.filter(j => Math.abs(j.y - i.y) <= 22).map(j => pfield(j.s)).filter(Boolean)).size >= 4).sort((a, b) => a.y - b.y), progs = [];
  heads.forEach((h, hi) => {
    const top = h.y - 22, end = hi + 1 < heads.length ? heads[hi + 1].y - 30 : Infinity;
    const hdr = items.filter(i => Math.abs(i.y - h.y) <= 22 && pfield(i.s)).map(i => ({f:pfield(i.s), n:pnorm(i.s), l:i.x, r:i.x + i.w}));
    let cols = hdr;
    const has = f => cols.some(x => x.f === f);
    if (has('sem') && has('week')) cols = cols.filter(x => x.f !== 'when');
    if (cols.some(x => x.n === 'رئيس')) cols = cols.filter(x => x.f !== 'owner' || x.n === 'رئيس');
    if (cols.some(x => x.n === 'ماليه')) cols = cols.filter(x => x.n !== 'المتطلبات');
    if (!cols.some(x => ['sem','week','when'].includes(x.f)) || !cols.some(x => x.f === 'owner')) return;
    const bottom = Math.max(...items.filter(i => Math.abs(i.y - h.y) <= 22 && pfield(i.s)).map(i => i.y)) + 3;
    // حدود الأعمدة في منتصف المسافة بين عناوينها، فالخانة العريضة لا تأخذ نص جارتها
    const span = {}; cols.forEach(x => { const o = span[x.f] ||= {f:x.f, l:x.l, r:x.r}; o.l = Math.min(o.l, x.l); o.r = Math.max(o.r, x.r); });
    const ord = Object.values(span).sort((a, b) => b.r - a.r); ord.forEach((x, k) => x.cut = k + 1 < ord.length ? (x.l + ord[k + 1].r) / 2 : -Infinity);
    const col = it => { const c = it.x + it.w / 2; return (ord.find(x => c >= x.cut) || ord[ord.length - 1]).f; };
    const body = items.filter(i => i.y > bottom && i.y < end);
    const lineOf = lab => { const l = items.find(i => pnorm(i.s) === lab && i.y < h.y && i.y > top - 140); if (!l) return ''; return ptext(items.filter(i => i !== l && Math.abs(i.y - l.y) <= 4 && i.x < l.x)); };
    const goal = lineOf('الهدفالعام'), sub = lineOf('الهدفالتفصيلي');
    let anchors = body.filter(i => col(i) === 'no' && /^\d+$/.test(latinDig(i.s.trim()))).sort((a, b) => a.y - b.y);

function absRange(from, to, g, minD){
  const days = S.attendance.filter(d => d.id >= from && d.id <= to).sort((a,b) => a.id < b.id ? -1 : 1);
  return S.students.filter(s => !g || s.grade === g).map(s => { const r = {s, abs:[], exc:[], late:[], days:0};
    days.forEach(d => { const v = d[s.id]; if (!v) return; r.days++; if (v === 'غياب بدون عذر') r.abs.push(d.id); else if (v === 'غياب بعذر') r.exc.push(d.id); else if (v === 'متأخر') r.late.push(d.id); });
    return r; }).filter(r => r.abs.length + r.exc.length >= minD && r.abs.length + r.exc.length + r.late.length > 0).sort((a,b) => b.abs.length - a.abs.length || String(a.s.name).localeCompare(String(b.s.name),'ar'));
