<style>
/* Layout: a right-hand rail (school identity + sections) beside a working area; official forms render as white paper sheets signed in blue ink. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EEEC; --ink:#13201D; --muted:#5A6A65; --line:#D8E1DE;
  --accent:#0B6B55; --accent-ink:#FFFFFF; --accent-soft:#E1F0EA;
  --sig:#1D3F8F;
  --ok:#11703A; --ok-soft:#E3F3E8; --warn:#9A5700; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE7E4;
  --shadow:0 1px 2px rgba(19,32,29,.06),0 8px 24px rgba(19,32,29,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#15201D; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98A9A3; --line:#2A3934;
  --accent:#3DB592; --accent-ink:#04231B; --accent-soft:#16372E; --sig:#93B2FF;
  --ok:#5BD18B; --ok-soft:#143A24; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8C7C; --bad-soft:#401D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98A9A3; --line:#2A3934;
  --accent:#3DB592; --accent-ink:#04231B; --accent-soft:#16372E; --sig:#93B2FF;
  --ok:#5BD18B; --ok-soft:#143A24; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8C7C; --bad-soft:#401D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);padding-block:24px;padding-inline:18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand .logo{width:112px;background:#fff;border-radius:8px;padding:6px 8px;margin-bottom:6px}
.brand .logo img,.gate .logo img{display:block;width:100%;height:auto}
.gate .logo{width:120px;background:#fff;border-radius:8px;padding:6px 8px;align-self:center}
.brand h1{font-size:20px}
.brand .school{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 6px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
.who{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.who b{color:var(--ink);font-weight:600}

.main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;min-width:0;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h2{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.wa{color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:16px}
.panel .sub{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .m{font-size:13px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--sunk);color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:10px 12px;background:var(--sunk);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.acts{white-space:nowrap}
.tbl td.acts .btn{margin-inline-start:4px}
.phone{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all}
.sigthumb{height:34px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 6px}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--warn);border-radius:5px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:end}

.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:14px}
.contact .k{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .t{font-weight:600}
.card .m{font-size:13px;color:var(--muted)}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.notice-bar{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.notice-bar.info{background:var(--accent-soft);color:var(--accent)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,17,.45);display:grid;place-items:center;z-index:50;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);border-radius:14px;width:min(720px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dlg.wide{width:min(900px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h3{font-size:18px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lb{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{min-height:90px;resize:vertical;line-height:1.7}
.f .hint{font-size:12px;color:var(--muted)}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.sigbox{border:1.5px dashed var(--line);border-radius:10px;background:#FFFFFF;position:relative}
.sigbox canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigbox .ph{position:absolute;inset:auto 12px 10px auto;font-size:12px;color:#8A9893;pointer-events:none}
.sigbox .line{position:absolute;inset:auto 24px 34px 24px;border-top:1px solid #C9D3CF;pointer-events:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:860px){
  .app{display:block}
  .side{position:static;height:auto;border-inline-start:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;gap:14px}
  .nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .nav button{padding:8px 10px;font-size:14px}
  .who{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fg{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav button{transition:background .15s,border-color .15s}}
</style>
<style id="docCss">
/* Official paper form: fixed white sheet in both themes, like the printed original. */
.paper{background:#fff;color:#111;border:1px solid #cfd6d3;border-radius:6px;padding:28px 30px;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:14.5px;line-height:1.9;direction:rtl;max-width:820px;margin:0 auto}
.paper .dh{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;border-bottom:2px solid #0B6B55;padding-bottom:10px;margin-bottom:10px;font-size:13px}
.paper .dh .lg img{height:68px;display:block}
.paper .dh .l{text-align:left}
.paper .dt{font-family:"Readex Pro",Tahoma,sans-serif;font-size:19px;font-weight:700;text-align:center;color:#0B6B55;line-height:1.4;margin:0 0 12px}
.paper .dt small{display:block;font-size:13px;color:#333;font-weight:500}
.paper h4{margin:16px 0 6px;font-size:14px;background:#EEF4F1;padding:4px 10px;border-radius:4px;color:#0B4D3E}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px}
.paper td,.paper th{border:1px solid #c9d1ce;padding:5px 8px;text-align:start}
.paper th{background:#F5F8F7;font-weight:600;width:22%}
.paper p{margin:6px 0}
.paper .sigrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;font-size:13px;align-items:end}
.paper .sigrow img{height:54px;max-width:100%;display:block}
.paper .sigrow .ln{border-bottom:1px dotted #888;min-height:56px;display:flex;align-items:flex-end}
.paper .opt{display:flex;gap:8px;align-items:flex-start}
.paper .box{display:inline-block;width:15px;height:15px;border:1.5px solid #333;border-radius:2px;flex:none;margin-top:6px;text-align:center;line-height:12px;font-size:12px;font-weight:700;color:#0B6B55}
.paper .foot{margin-top:18px;border-top:1px solid #ddd;padding-top:8px;font-size:11.5px;color:#555}
.paper .pend{color:#9A5700}
.paper .ltr{direction:ltr;unicode-bidi:isolate}
.paper .dots{color:#9aa3a0;letter-spacing:1px}
.paper .lines div{border-bottom:1px dotted #9aa3a0;height:28px}
.paper .sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:22px;font-size:13px;text-align:center}
.paper .sigs .s{display:flex;flex-direction:column;gap:4px}
.paper .sigs .s div{border-bottom:1px dotted #777;height:40px}
.paper .ltext{white-space:pre-wrap;line-height:2.1;font-size:15px}
.paper .lg{text-align:center;font-size:12px;margin:4px 0 8px}
.paper.land{max-width:1100px}
.paper table.sheet{table-layout:fixed;font-size:12.5px}
.paper table.sheet th,.paper table.sheet td{width:auto;text-align:center;height:30px;padding:2px 4px}
.paper table.sheet.sm th,.paper table.sheet.sm td{height:22px;font-size:11px}
.paper table.sheet .nm{width:150px;text-align:start}
.paper table.sheet .n{width:34px}
.paper table.sheet .rem{width:120px}
.paper table.sheet td.off{background:repeating-linear-gradient(45deg,#f2f2f2,#f2f2f2 4px,#e2e2e2 4px,#e2e2e2 8px)}
.paper table.sheet td.bx em{font-size:9.5px;color:#666;font-style:normal;display:block}
@media (max-width:600px){.paper{padding:18px 16px}.paper .dh{grid-template-columns:1fr;text-align:center}.paper .dh .l{text-align:center}.paper .dh .lg{order:-1;justify-self:center}.paper .sigrow{grid-template-columns:1fr}}
</style>
<style>
/* login and portal screens */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate .box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gate h1{font-size:22px}
.gate p{margin:0;color:var(--muted);font-size:14px}
.portal{max-width:860px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.portal .brandbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:12px}
.portal .brandbar h1{font-size:22px}
.portal .brandbar .m{color:var(--muted);font-size:13px}
.done{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:14px 16px;font-weight:600}
#printArea{display:none}
@media print{
  body{background:#fff}
  body.printing > *:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea .paper{border:0;max-width:none;padding:0}
  #printArea .paper.land{page:land}
  @page{size:A4;margin:12mm}
  @page land{size:A4 landscape;margin:10mm}
}
</style>
</head>

<div id="gateRoot"></div>
<div class="app" id="appRoot" hidden>
  <aside class="side">
    <div class="brand">
      <div class="logo"><img src="logo.jpg" alt="شعار وزارة التعليم"></div>
      <span class="eyebrow" id="regionLine"></span>
      <h1>منصة المدير</h1>
      <span class="school" id="schoolLine"></span>
    </div>
    <nav class="nav" id="nav" aria-label="أقسام المنصة"></nav>
    <div class="who" id="who"><span>جارٍ التعرف على صلاحيتك…</span></div>

  <main class="main" id="main">

    <div class="empty">ستظهر هنا أعداد المعلمين والغياب والمساءلات واختبارات اليوم بعد التحميل.</div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
const z = n => String(n).padStart(2,'0');
const isoDay = (d = new Date()) => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
let fH, fDay, fStamp;
try { fH = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}); } catch { fH = null; }
try { fDay = new Intl.DateTimeFormat('ar-SA', {weekday:'long'}); } catch { fDay = null; }
try { fStamp = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'}); } catch { fStamp = null; }
const hij = s => { if (!s) return '—'; try { return fH ? fH.format(parseD(s)) : s; } catch { return s; } };
const dayName = s => { try { return fDay ? fDay.format(parseD(s)) : ''; } catch { return ''; } };
const stamp = ts => { if (!ts) return '—'; try { return fStamp ? fStamp.format(new Date(ts)) : new Date(ts).toLocaleString(); } catch { return ''; } };

/* ---------- phones ---------- */
function intl(p){ let d = String(p||'').replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05') && d.length === 10) d = '966' + d.slice(1); else if (d.startsWith('5') && d.length === 9) d = '966' + d;
  return d.length >= 11 ? d : ''; }
const waLink = (phone, text) => { const n = intl(phone); return n ? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : ''; };
const phoneCell = p => p ? `<span class="phone">${esc(p)}</span> <button class="btn sm" data-act="copy" data-v="${esc(p)}" title="نسخ الرقم">نسخ</button>` : '<span class="m">—</span>';

function upsert(col, id, data, merge){
  if (col === 'settings') { S.settings = merge ? {...S.settings, ...data} : {...data}; return; }
  const arr = S[col]; if (!arr) return; const i = arr.findIndex(x => x.id === id);
  const doc = {...(merge && i >= 0 ? arr[i] : {}), ...data, id};
  if (i >= 0) arr[i] = doc; else arr.push(doc);
}

const pads = {};
function mountSig(id){
  const c = document.getElementById(id); if (!c) return;
  const ratio = window.devicePixelRatio || 1;
  const fit = () => { c.width = c.clientWidth * ratio; c.height = c.clientHeight * ratio; const x = c.getContext('2d'); x.scale(ratio, ratio); x.lineCap='round'; x.lineJoin='round'; x.lineWidth=2.4; x.strokeStyle='#1D3F8F'; };
  fit();
  const ctx = c.getContext('2d'); let down = false, last = null; const pad = { dirty:false };
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => { down = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, 6.3); ctx.fillStyle='#1D3F8F'; ctx.fill(); pad.dirty = true; });
  c.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const up = () => { down = false; }; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  pad.clear = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height); ctx.restore(); pad.dirty = false; };
  pad.data = () => { if (!pad.dirty) return null; const o = document.createElement('canvas'); o.width = 480; o.height = Math.round(480 * c.height / c.width); o.getContext('2d').drawImage(c, 0, 0, o.width, o.height); return o.toDataURL('image/png'); };
  pads[id] = pad;
}

function render(force){

const loadingNote = () => S.loaded ? '' : '<div class="notice-bar info">جارٍ تحميل البيانات…</div>';

/* ---------- views ---------- */

    <div class="kpi ${waitT.length?'warn':''}"><span class="v">${waitT.length}</span><span class="l">مساءلة بانتظار رد المعلم</span></div>
    <div class="kpi ${waitP.length?'bad':''}"><span class="v">${waitP.length}</span><span class="l">بانتظار قرار المدير</span></div>
    <div class="kpi"><span class="v">${exToday.length}</span><span class="l">اختبار اليوم</span></div>
    <div class="kpi ${parPend.length?'warn':''}"><span class="v">${parPend.length}</span><span class="l">نموذج ينتظر ولي الأمر</span></div>
    ${(() => { const L = todayLessons(); return `<div class="kpi ${L.pct === null ? '' : L.pct >= 95 ? '' : L.pct >= 85 ? 'warn' : 'bad'}"><span class="v">${L.pct === null ? '—' : L.pct + '٪'}</span><span class="l">تنفيذ الحصص اليوم${L.miss ? ` · ${L.miss} لم تُنفَّذ` : ''}</span></div>`; })()}
    ${(() => { const D = S.attendance.find(x => x.id === today) || {}; const v = Object.entries(D).filter(([k,x]) => k !== 'id' && x); const pr = v.filter(([,x]) => x === 'حاضر' || x === 'متأخر').length; return S.students.length ? `<div class="kpi"><span class="v">${v.length ? Math.round(pr / v.length * 100) + '٪' : '—'}</span><span class="l">حضور الطلاب اليوم</span></div>` : ''; })()}
  </div>
  <div class="grid2">
    <section class="panel"><h3>يحتاج إجراء</h3>
      ${actions.length ? `<div class="list">${actions.map(a => `<div class="row"><div><div class="t">${esc(a.t)}</div><div class="m">${esc(a.m)}</div></div><div class="tools"><span class="chip ${a.c[0]}">${a.c[1]}</span><button class="btn sm" data-act="${a.act}" data-id="${a.id}">فتح</button></div></div>`).join('')}</div>`

        : '<div class="empty">لا توجد مساءلات أو نماذج معلقة.</div>'}
    </section>
    <section class="panel"><h3>الأكثر غيابًا وتأخرًا</h3><p class="sub">عدد السجلات منذ بداية العام</p>
      ${top.length ? `<div class="bars">${top.map(([id,n]) => `<div class="bar"><span>${esc(tName(id))}</span><div class="track"><div class="fill" style="width:${Math.round(n/mx*100)}%"></div></div><span class="n">${n}</span></div>`).join('')}</div>` : '<div class="empty">لم يُسجَّل غياب بعد.</div>'}
      <h3 style="margin-top:8px">أرقام التواصل</h3>
      <div class="contact">
        <span class="k">مدير المدرسة</span><span>${esc(principal())}</span><span>${set().phone ? phoneCell(set().phone) : '<a href="#settings" data-act="tab" data-id="settings">أضف الرقم</a>'}</span>

    <section class="panel"><h3>مهام اليوم</h3>

  2:{t:'الدرجة الثانية — مخالفة متوسطة', ex:'تكرار مخالفات الدرجة الأولى، الإهمال المتعمد للواجبات، الغياب بلا عذر', steps:['مقابلة الطالب مع المرشد الطلابي','إشعار خطي لولي الأمر','أخذ تعهد خطي من الطالب','متابعة أسبوعية لمدة أسبوعين']},
  3:{t:'الدرجة الثالثة — مخالفة كبيرة', ex:'الغش، الإساءة اللفظية، الخروج من المدرسة بلا إذن، التدخين', steps:['استدعاء ولي الأمر وتوقيع محضر','خصم من درجات السلوك وفق اللائحة','تعهد مشدد وإحالة للإرشاد الطلابي','خطة سلوكية فردية لمدة شهر']},
  4:{t:'الدرجة الرابعة — مخالفة جسيمة', ex:'الاعتداء الجسدي، إتلاف الممتلكات، التزوير، التنمر المتكرر', steps:['عقد لجنة التوجيه الطلابي وتحرير محضر','استدعاء عاجل لولي الأمر','تحويل الطالب للوحدة الإرشادية أو الأخصائي','إشعار إدارة التعليم عند الاقتضاء']},
  5:{t:'الدرجة الخامسة — مخالفة خطيرة', ex:'حيازة أدوات حادة أو مواد ممنوعة، اعتداء جسيم، تهديد سلامة الآخرين', steps:['عزل الطالب فورًا وتأمين سلامة الجميع','إبلاغ ولي الأمر وإدارة التعليم كتابيًا فورًا','تحرير محضر رسمي مفصّل بالوقائع والشهود','إحالة الحالة للجهة المختصة وفق اللوائح والأنظمة']}
};
const ATT = ['حاضر','متأخر','غياب بعذر','غياب بدون عذر'];
const ATT_C = {'حاضر':'ok','متأخر':'warn','غياب بعذر':'info','غياب بدون عذر':'bad'};
const student = id => S.students.find(s => s.id === id);
const sName = id => student(id)?.name || '—';
const sClass = s => [s.grade, s.cls].filter(Boolean).join(' / ');
function stuStat(id){
  let days = 0, abs = 0, exc = 0, late = 0;
  S.attendance.forEach(d => { const v = d[id]; if (!v) return; days++; if (v === 'غياب بدون عذر') abs++; else if (v === 'غياب بعذر') exc++; else if (v === 'متأخر') late++; });
  const inc = S.incidents.filter(i => i.studentId === id);
  return {days, abs, exc, late, rate: days ? Math.round((days - abs - exc) / days * 100) : null, inc, maxDeg: inc.reduce((m,i) => Math.max(m, +i.deg || 0), 0)};
}
function atRisk(){
  const c = cfg();
  return S.students.map(s => { const st = stuStat(s.id), r = [];
    if (st.rate !== null && st.rate < 100 - c.absLimit) r.push(`نسبة الحضور ${st.rate}٪`);
    if (st.inc.length >= c.incLimit) r.push(`${st.inc.length} مخالفات`);
    if (st.maxDeg >= 4) r.push('مخالفة جسيمة');
    if (st.late >= 5) r.push(`تأخر ${st.late} مرات`);
    return {s, st, r}; }).filter(x => x.r.length).sort((a,b) => b.r.length - a.r.length);
}
function vStudents(){
  const tab = UI.sTab || 'list';
  const seg = [['list','سجل الطلاب'],['att','الحضور اليومي'],['beh','السلوك']].map(([k,l]) => `<button data-act="sTab" data-id="${k}" aria-pressed="${tab===k}">${l}</button>`).join('');
  const tools = !isAdmin() ? '' : tab === 'list' ? '<button class="btn pri" data-act="addStudent">إضافة طالب</button><button class="btn" data-act="bulkStudents">إضافة مجموعة</button>'
    : tab === 'beh' ? '<button class="btn pri" data-act="addIncident">تسجيل مخالفة</button>' : '';
  let body;
  if (tab === 'att') body = vAttendance();
  else if (tab === 'beh') body = vBehavior();
  else {
    const rows = sortBy(S.students, 'name').map(s => { const st = stuStat(s.id);
      const wa = waLink(s.phone, `ولي أمر الطالب/ ${s.name}\nالسلام عليكم ورحمة الله وبركاته\n`);
      return `<tr data-q="${esc([s.name, s.grade, s.cls, s.guard].join(' '))}"><td><b>${esc(s.name)}</b><div style="font-size:12px;color:var(--muted)">${esc(sClass(s))}</div></td>
        <td>${esc(s.guard || '—')}<div>${s.phone ? `<span class="phone">${esc(s.phone)}</span>` : ''} ${wa ? `<a class="btn sm wa" href="${esc(wa)}" target="_blank" rel="noopener">واتساب</a>` : ''}</div></td>
        <td>${st.rate === null ? '—' : `<span class="chip ${st.rate >= 90 ? 'ok' : st.rate >= 80 ? 'warn' : 'bad'} num">${st.rate}٪</span>`}</td>
        <td class="num">${st.abs}</td><td class="num">${st.inc.length}</td>
        <td class="acts"><button class="btn sm" data-act="studentFile" data-id="${s.id}">الملف</button>${isAdmin() ? `<button class="btn sm" data-act="editStudent" data-id="${s.id}">تعديل</button><button class="btn sm danger" data-act="delStudent" data-id="${s.id}">حذف</button>` : ''}</td></tr>`; }).join('');
    body = S.students.length ? `<div class="f" style="max-width:360px"><input id="stuQ" placeholder="ابحث بالاسم أو الصف أو الفصل" aria-label="بحث في الطلاب"></div>
      <div class="tablewrap"><table class="tbl" id="stuTbl"><thead><tr><th>الطالب</th><th>ولي الأمر</th><th>الحضور</th><th>غياب بلا عذر</th><th>مخالفات</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="empty">لا يوجد طلاب بعد. اضغط «إضافة مجموعة» والصق الأسماء من نور أو Excel دفعة واحدة.</div>';
  }
  return head('الطلاب', 'سجل الطلاب وأولياء أمورهم، والحضور اليومي، والمخالفات السلوكية مع الإجراء المقترح.', tools) + loadingNote() +
    `<div class="seg" role="group" aria-label="أقسام الطلاب">${seg}</div>` + body;
}

function vAttendance(){

  const list = sortBy(S.students.filter(s => !g || s.grade === g), 'name');
  const D = S.attendance.find(x => x.id === date) || {};
  const cnt = {}; ATT.forEach(a => cnt[a] = list.filter(s => D[s.id] === a).length);
  const un = list.filter(s => !D[s.id]).length;
  return `<div class="panel"><div class="fg">
      <div class="f"><label for="attDate">التاريخ</label><input type="date" id="attDate" value="${esc(date)}"><span class="hint">${esc(dayName(date))} ${esc(hij(date))}</span></div>
      <div class="f"><label for="attGrade">الصف</label><select id="attGrade"><option value="">كل الصفوف</option>${grades.map(x => `<option ${x === g ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div></div>
    <div class="tools">${ATT.map(a => `<span class="chip ${ATT_C[a]}">${a}: ${cnt[a]}</span>`).join('')}<span class="chip mute">لم يُرصد: ${un}</span>
      ${isAdmin() && un ? '<button class="btn sm" data-act="allPresent">تحديد غير المرصودين حاضرين</button>' : ''}</div></div>
    ${list.length ? `<div class="tablewrap"><table class="tbl"><thead><tr><th>الطالب</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(s => { const v = D[s.id];
      const wa = v === 'غياب بدون عذر' && waLink(s.phone, `ولي أمر الطالب/ ${s.name}\nالسلام عليكم ورحمة الله وبركاته\nنحيطكم علمًا بغياب ابنكم اليوم ${dayName(date)} ${hij(date)} دون عذر. نأمل متابعته وتزويد المدرسة بالعذر إن وجد.\n${school()}`);
      return `<tr><td><b>${esc(s.name)}</b><div style="font-size:12px;color:var(--muted)">${esc(sClass(s))}</div></td>
      <td><div class="seg">${ATT.map(a => `<button data-act="mark" data-id="${s.id}" data-v="${a}" aria-pressed="${v === a}">${a}</button>`).join('')}</div></td>
      <td>${wa ? `<a class="btn sm wa" href="${esc(wa)}" target="_blank" rel="noopener">إشعار ولي الأمر</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`
      : '<div class="empty">لا يوجد طلاب في هذا الصف. أضف الطلاب من «سجل الطلاب».</div>'}
    <div class="notice-bar info">الغياب بدون عذر يدخل في «الإنذار المبكر» في لوحة المتابعة عند تجاوز ${cfg().absLimit}٪ (يُضبط من الإعدادات).</div>`;
}

function markAll(){
  const date = UI.attDate || today(), g = UI.attGrade || ''; const D = S.attendance.find(x => x.id === date) || {};
  const upd = {}; S.students.filter(s => (!g || s.grade === g) && !D[s.id]).forEach(s => upd[s.id] = 'حاضر');
  if (Object.keys(upd).length) save2('attendance', date, upd).then(ok => ok && toast('رُصد الحضور'));
}

  return {n, inn, late, miss, pct: n ? Math.round((inn + late * .5) / n * 100) : null};
}

}

const GR_MATRIX = [['الأول','رياضيات'],['الأول','لغتي'],['الثاني','رياضيات'],['الثاني','لغتي'],['الثالث','رياضيات'],['الثالث','لغتي'],['الثالث','علوم'],['الثالث','إنجليزي'],

const CTRL_ROLES = ['','مصحح','مراجع','مدقق','كنترول','ملاحظ'];
const NEAR = {ar:['isl','soc','eng'], isl:['ar','soc'], soc:['isl','ar'], math:['sci'], sci:['math'], eng:['ar']};
function canon(s){ s = String(s || '').trim();
  if (/لغتي|عربي|عربية|لغة عربية/.test(s)) return 'ar'; if (/علوم/.test(s)) return 'sci'; if (/رياض/.test(s)) return 'math';
  if (/إنجليز|انجليز/.test(s)) return 'eng'; if (/إسلام|اسلام|قرآن|توحيد|فقه/.test(s)) return 'isl'; if (/اجتماع/.test(s)) return 'soc'; return 'x_' + s; }
const sdist = (tc, rc) => tc === rc ? 0 : ((NEAR[rc] || []).indexOf(tc) + 1) || 50;
const graders = () => S.teachers.filter(t => !['كنترول','ملاحظ'].includes(t.ctrlRole));
const GR_ROLE = {corrector:'تصحيح', reviewer:'مراجعة', auditor:'تدقيق'};
function teacherSelBySpec(row, f){
  const rc = canon(row.subject), cur = row[f] || '';
  const groups = {0:[], 1:[], 2:[]}; graders().forEach(t => { const d = sdist(canon(t.specialty), rc); groups[d === 0 ? 0 : d < 50 ? 1 : 2].push(t); });
  const opt = t => `<option value="${t.id}" ${t.id === cur ? 'selected' : ''}>${esc(t.name)}${t.specialty ? ' — ' + esc(t.specialty) : ''}</option>`;
  return `<select data-gid="${row.id}" data-gf="${f}" aria-label="${GR_ROLE[f]}" ${isAdmin() ? '' : 'disabled'}><option value="">—</option>${cur && !teacher(cur) ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : ''}
    ${[['نفس التخصص',0],['تخصص قريب',1],['آخرون',2]].map(([l,k]) => groups[k].length ? `<optgroup label="${l}">${sortBy(groups[k],'name').map(opt).join('')}</optgroup>` : '').join('')}</select>`;
}
function vGrading(){
  const rows = [...S.grading].sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
  const inp = (r, f, ph, type) => `<input data-gid="${r.id}" data-gf="${f}" value="${esc(r[f] || '')}" placeholder="${ph || ''}" ${type ? `type="${type}"` : ''} ${isAdmin() ? '' : 'disabled'} style="min-width:${type === 'number' ? 64 : 100}px">`;
  const rasd = rows.filter(r => r.rasd).length;

// توزيع عادل: المصحح من نفس التخصص أو أقربه، والمراجع والمدقق بأقل عبء، ثم الملاحظون للاختبارات بلا ملاحظ
async function grAuto(){
  const el = graders(); if (!el.length) return toast('أضف المعلمين أولًا', 'bad');
  const load = Object.fromEntries(S.teachers.map(t => [t.id, 0]));
  const pickC = (subject, used) => { const rc = canon(subject); return el.filter(t => !used.has(t.id)).sort((a,b) => (sdist(canon(a.specialty), rc) - sdist(canon(b.specialty), rc)) || (load[a.id] - load[b.id]))[0]; };
  const pickB = (subject, used) => { const rc = canon(subject); return el.filter(t => !used.has(t.id)).sort((a,b) => (load[a.id] - load[b.id]) || (sdist(canon(a.specialty), rc) - sdist(canon(b.specialty), rc)))[0]; };
  const plan = [...S.grading].sort((a,b) => (a.order ?? 0) - (b.order ?? 0)).map(r => { const used = new Set(), u = {};
    for (const [f, pick] of [['corrector', pickC], ['reviewer', pickB], ['auditor', pickB]]) { const t = pick(r.subject, used); u[f] = t ? t.id : ''; if (t) { used.add(t.id); load[t.id]++; } }
    return [r.id, u]; });
  S.exams.forEach(e => { if (e.observerId && load[e.observerId] !== undefined) load[e.observerId]++; });
  const obs = S.exams.filter(e => !e.observerId).map(e => { const t = [...S.teachers].sort((a,b) => load[a.id] - load[b.id])[0]; if (t) load[t.id]++; return [e.id, t?.id]; }).filter(x => x[1]);
  confirmBox('توزيع تلقائي', `سيُوزَّع التصحيح والمراجعة والتدقيق لـ ${plan.length} مادة${obs.length ? ` والملاحظة لـ ${obs.length} اختبار بلا ملاحظ` : ''} بالعدل بين ${el.length} معلمًا مع مراعاة التخصص. يُستبدل التوزيع الحالي.`, 'توزيع', async () => {
    for (const [id, u] of plan) await put('grading/' + id, u, true);
    for (const [id, tid] of obs) await put('exams/' + id, {observerId:tid}, true);
    toast('تم التوزيع');
  });
}

الموضوع: الالتزام بدخول الحصص في وقتها

انطلاقًا من حرص المدرسة على استثمار زمن الحصة الدراسية، وحفاظًا على انضباط البيئة التعليمية وسلامة الطلاب، نأمل من الجميع التقيد بما يلي:

١. التوجه إلى الفصل فور سماع جرس بداية الحصة ودون أي تأخير، وعدم البقاء في غرفة المعلمين أو الممرات.
٢. عدم مغادرة الفصل قبل جرس نهاية الحصة، وعدم تسريح الطلاب مبكرًا لأي سبب.
٣. عدم ترك الطلاب دون إشراف مطلقًا؛ وعند الضرورة القصوى يُبلَّغ وكيل المدرسة أو المدير قبل المغادرة.
٤. الاستئذان المسبق كتابيًا لأي غياب أو تأخر متوقع، مع تسليم خطة الحصة لمعلم الاحتياط.
٥. الالتزام بجدول الحصص المعتمد، وعدم تبادل الحصص بين المعلمين إلا بموافقة إدارة المدرسة.
٦. عدم استقبال الزيارات أو إجراء المكالمات أثناء الحصة.
٧. تفعيل الحصة من بدايتها حتى نهايتها بما يحقق أهداف الدرس، وتسليم الطلاب لمعلم الحصة التالية.

وتفيدكم الإدارة بأن دخول الحصص يُرصد يوميًا وفق نموذج المتابعة المعتمد، وأن ما يُرصد من مخالفات يُعالج بالإجراءات النظامية المتدرجة، ويُعد ضمن عناصر تقويم الأداء الوظيفي.

 'تعليمات دخول الحصص (كاملة)':d=>`${d.school}
تعليمات تنظيم دخول الحصص ومتابعتها
العام الدراسي ${d.year}                    تاريخ الاعتماد: ${d.date}

أولًا: الهدف والنطاق
١. تنظيم دخول المعلمين لحصصهم وضمان عدم إهدار زمن الحصة.
٢. تسري هذه التعليمات على جميع أعضاء الهيئة التعليمية دون استثناء، وعلى جميع الحصص بما فيها حصص الانتظار والنشاط.

ثانيًا: مواعيد الحصص
٣. يبدأ زمن الحصة من جرس البداية وينتهي بجرس النهاية، ويُعد المعلم متأخرًا إذا لم يدخل خلال (٣) دقائق من الجرس.
٤. يُعد المعلم غير منفذ للحصة إذا لم يدخل الفصل خلال (١٠) دقائق دون عذر مقبول.
٥. زمن الانتقال بين الفصول جزء من مسؤولية المعلم، ولا يُقبل الاعتذار بالتأخر بسبب البُعد إلا في الحالات المعتمدة من الإدارة.

ثالثًا: آلية الدخول والخروج
٦. يستقبل المعلم طلابه عند باب الفصل ويتأكد من انتظامهم قبل بدء الدرس.
٧. يتحقق المعلم من حضور الطلاب ويرصده في الحصة الأولى ويبلغ عن أي غياب طارئ.
٨. لا يُسمح بإخراج الطالب من الحصة عقوبةً؛ وتُعالج المخالفات وفق لائحة السلوك والمواظبة.
٩. لا يغادر المعلم الفصل إلا بعد جرس النهاية وتسليم الطلاب للحصة التالية.

رابعًا: الاستئذان والاحتياط
١٠. يُقدَّم طلب الاستئذان قبل يوم عمل واحد على الأقل، عدا الحالات الطارئة فيُبلَّغ فورًا هاتفيًا.
١١. على المعلم المستأذن تسليم خطة الحصة وأوراق العمل لوكيل الشؤون التعليمية.
١٢. يلتزم معلم الاحتياط بتنفيذ الحصة كاملة وفق الخطة المسلّمة، لا بمجرد الإشراف على الطلاب.
١٣. لا يُعد إبلاغ الزميل بديلًا عن إبلاغ الإدارة رسميًا.

خامسًا: المتابعة والرصد
١٤. تتولى إدارة المدرسة الرصد اليومي لدخول الحصص عبر نموذج المتابعة المعتمد (دخل / متأخر / لم يدخل).
١٥. يُحتسب لكل معلم مؤشر التزام تراكمي طوال الفصل الدراسي، ويُطلع عليه المعلم عند طلبه.
١٦. تُعرض نتائج الالتزام في تقرير أسبوعي داخلي، ويُوثَّق ملخصها في ملف الأداء.

سادسًا: الإجراءات المتدرجة عند المخالفة
١٧. المخالفة الأولى: توجيه شفهي موثّق من مدير المدرسة.
١٨. المخالفة الثانية: خطاب مساءلة خطي يُجاب عنه خلال ثلاثة أيام عمل.
١٩. المخالفة الثالثة: لفت نظر خطي يُودع في ملف المعلم.
٢٠. التكرار بعد ذلك: إحالة الموضوع لإدارة التعليم وفق الأنظمة واللوائح المعتمدة.
٢١. لا يُنتقل إلى إجراء لاحق دون توثيق ما قبله، ويُمنح المعلم حق الرد قبل أي إجراء.

سابعًا: الأعذار المقبولة
٢٢. تُقبل الأعذار الطارئة الموثقة (الحالات الصحية، التكليف الرسمي، أمر إداري من الإدارة)، ويُثبت العذر في السجل ولا يُحتسب مخالفة.
٢٣. تكرار الأعذار غير الموثقة يُعامل معاملة المخالفة.

ثامنًا: التحفيز
٢٤. يُكرَّم المعلمون الحاصلون على التزام (١٠٠٪) في نهاية كل فصل دراسي بخطاب شكر يُودع في ملفاتهم.

تاسعًا: السريان
٢٥. يُعمل بهذه التعليمات اعتبارًا من تاريخ اعتمادها، ويُلغى ما يتعارض معها.
٢٦. مسؤولية تنفيذ هذه التعليمات تقع على وكيل الشؤون التعليمية بإشراف مدير المدرسة.

/* ---------- admin: login & sync ---------- */
function gate(html){ $('#appRoot').hidden = true; $('#gateRoot').innerHTML = `<div class="gate"><div class="box"><div class="logo"><img src="${LOGO}" alt="شعار وزارة التعليم"></div>${html}</div></div>`; const i = $('#gateRoot input'); if (i) i.focus(); }
const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){ let c = store.get('mdr.newcode'); if (!c) { const r = crypto.getRandomValues(new Uint8Array(8)); c = [...r].map(x => CODE_CH[x % 32]).join('').replace(/^(.{4})/, '$1-'); store.set('mdr.newcode', c); } return c; }
const signedIn = r => { token = r.token; store.set('mdr.token', token); store.set('mdr.code', r.code); S.code = r.code; history.replaceState(null, '', location.pathname); startAdmin(); };
function showLogin(){
  const code = store.get('mdr.code') || '';
  gate(`<h1>دخول المدير</h1><p>اكتب رمز مدرستك وكلمة المرور. المعلمون وأولياء الأمور لا يحتاجون دخولًا، فهم يوقّعون من الروابط التي تصلهم بالواتساب.</p>
    <form id="gForm" class="fg" style="grid-template-columns:1fr">
      <div class="f"><label for="g_code">رمز المدرسة</label><input id="g_code" dir="ltr" autocomplete="username" placeholder="XXXX-XXXX" value="${esc(code)}"></div>
      <div class="f"><label for="g_pw">كلمة المرور</label><input id="g_pw" type="password" autocomplete="current-password"></div>
      <button class="btn pri" type="submit">دخول</button></form>
    <p style="margin-top:14px">مدرستك غير مشتركة بعد؟ <a href="#" id="toReg">اشترك وفعّل المنصة لمدرستك</a></p>`);
  if (code) $('#g_pw').focus();
  $('#toReg').onclick = e => { e.preventDefault(); showRegister(); };
  $('#gForm').onsubmit = async e => { e.preventDefault();
    try { signedIn(await api('/login', {method:'POST', json:{code:fval('g_code'), password:fval('g_pw')}})); } catch(err){ toast(errMsg(err), 'bad'); } };
}
function showRegister(){
  // رابط التفعيل من البائع يحمل رمز المدرسة والمفتاح: #code=XXXX-XXXX&key=...
  const lc = (location.hash.match(/[#&]code=([A-Za-z0-9-]{8,9})/) || [])[1], lk = (location.hash.match(/[#&]key=([A-Za-z2-7-]{90,})/) || [])[1];
  if (lc) store.set('mdr.newcode', lc.toUpperCase());
  const code = newCode();
  const wa = waLink(SELLER, `السلام عليكم، أرغب في الاشتراك في «منصة المدير» لمدرستي.\nرمز المدرسة: ${code}`);
  gate(`<h1>تفعيل منصة المدير لمدرستك</h1>
    ${lk ? `<p style="color:var(--ok,#0a7a4f)"><b>وصل مفتاح التفعيل ✓</b> أكمل بيانات المدرسة واختر كلمة المرور في الأسفل.</p>` : ''}
    <p><b>١)</b> أرسل رمز مدرستك للبائع بالواتساب، وبعد إتمام الاشتراك يصلك مفتاح التفعيل.</p>
    <div class="f" style="margin:8px 0"><label>رمز المدرسة</label><div style="display:flex;gap:8px;align-items:center"><b class="phone" style="font-size:22px;letter-spacing:2px" dir="ltr">${esc(code)}</b><button class="btn sm" type="button" data-act="copy" data-v="${esc(code)}">نسخ</button></div></div>
    <a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">إرسال الرمز بالواتساب</a>
    <p style="margin-top:16px"><b>٢)</b> عند وصول المفتاح الصقه هنا، واكتب بيانات المدرسة واختر كلمة مرور لوحة المدير.</p>
    <form id="gForm" class="fg" style="grid-template-columns:1fr">
      <div class="f"><label for="r_key">مفتاح التفعيل</label><textarea id="r_key" dir="ltr" rows="3" autocomplete="off" spellcheck="false" placeholder="الصق المفتاح كاملًا">${esc(lk || '')}</textarea></div>
      <div class="f"><label for="r_school">اسم المدرسة</label><input id="r_school" placeholder="مثل: مدرسة ... الابتدائية"></div>
      <div class="f"><label for="r_region">الإدارة التعليمية</label><input id="r_region" placeholder="مثل: الإدارة العامة للتعليم بمنطقة الرياض"></div>
      <div class="f"><label for="r_year">العام الدراسي</label><input id="r_year" value="١٤٤٨هـ"></div>
      <div class="f"><label for="r_n">اسم مدير المدرسة</label><input id="r_n"></div>
      <div class="f"><label for="r_ph">جوال مدير المدرسة</label><input id="r_ph" dir="ltr" inputmode="tel" placeholder="05xxxxxxxx"></div>
      <div class="f"><label for="r_pw">كلمة المرور</label><input id="r_pw" type="password" autocomplete="new-password" minlength="6"></div>
      <div class="f"><label for="r_pw2">تأكيد كلمة المرور</label><input id="r_pw2" type="password" autocomplete="new-password"></div>
      <button class="btn pri" type="submit">تفعيل وبدء الاستخدام</button></form>
    <p style="margin-top:14px">مدرستك مشتركة؟ <a href="#" id="toLogin">دخول المدير</a></p>`);
  if (!lk) { document.activeElement?.blur(); window.scrollTo(0, 0); }
  $('#toLogin').onclick = e => { e.preventDefault(); showLogin(); };
  $('#gForm').onsubmit = async e => { e.preventDefault();
    if (!fval('r_key')) return toast('الصق مفتاح التفعيل', 'bad');
    if (!fval('r_school')) return toast('اكتب اسم المدرسة', 'bad');
    if (fval('r_pw') !== fval('r_pw2')) return toast('كلمتا المرور غير متطابقتين', 'bad');
    try { signedIn(await api('/register', {method:'POST', json:{code, key:fval('r_key'), school:fval('r_school'), region:fval('r_region'), year:fval('r_year'), principal:fval('r_n'), phone:fval('r_ph'), password:fval('r_pw')}})); store.set('mdr.newcode', null); }
    catch(err){ toast(errMsg(err), 'bad'); } };
}
async function loadAll(manual){
  try {
    const d = await api('/all');
    COLS.forEach(c => S[c] = d[c] || []); S.settings = d.settings || {}; S.code = d.code; S.syncedAt = Date.now();
    const first = !S.loaded; S.loaded = true; render(first || !UI.setDirty);
    if (manual) toast('تم التحديث');
  } catch(e){ if (e.code !== 'unauthorized') toast(errMsg(e), 'bad'); }
}
function startAdmin(){
  $('#gateRoot').innerHTML = ''; $('#appRoot').hidden = false;
  loadAll();
  clearInterval(startAdmin.t); startAdmin.t = setInterval(() => { if (document.visibilityState === 'visible' && !$('#modalRoot').innerHTML) loadAll(); }, 30000);
}
document.addEventListener('visibilitychange', () => { if (MODE === 'admin' && token && S.loaded && document.visibilityState === 'visible' && !$('#modalRoot').innerHTML) loadAll(); });
function changePwForm(){
  modal('تغيير كلمة المرور', `<div class="fg"><div class="f full"><label for="pw_o">كلمة المرور الحالية</label><input id="pw_o" type="password" autocomplete="current-password"></div>
    <div class="f"><label for="pw_n">الجديدة</label><input id="pw_n" type="password" autocomplete="new-password"></div><div class="f"><label for="pw_n2">تأكيدها</label><input id="pw_n2" type="password" autocomplete="new-password"></div></div>
    <p style="margin:0;color:var(--muted);font-size:13px">يخرج كل من سجّل الدخول بكلمة المرور القديمة على الأجهزة الأخرى.</p>`,
    `<button class="btn pri" id="ok">حفظ</button><button class="btn" data-act="close">إلغاء</button>`);
  $('#ok').onclick = async () => {
    if (fval('pw_n') !== fval('pw_n2')) return toast('كلمتا المرور غير متطابقتين', 'bad');
    try { const r = await api('/password', {method:'POST', json:{old:fval('pw_o'), password:fval('pw_n')}}); token = r.token; store.set('mdr.token', token); closeModal(); toast('تغيّرت كلمة المرور'); } catch(e){ toast(errMsg(e), 'bad'); }
  };
}

/* ---------- teacher & parent portals ---------- */
const portalHead = (title, sub) => `<div class="brandbar"><div class="logo" style="width:96px;background:#fff;border-radius:8px;padding:5px 7px"><img src="${LOGO}" alt="شعار وزارة التعليم" style="display:block;width:100%"></div><div style="flex:1;min-width:200px"><span class="m">${set().region ? esc(set().region) + ' · ' : ''}${esc(school())}</span><h1>${esc(title)}</h1>${sub ? `<span class="m">${sub}</span>` : ''}</div>
  <div class="contact"><span class="k">مدير المدرسة</span><span>${esc(principal())}</span><span>${set().phone ? `<a class="phone" href="tel:${esc(set().phone)}">${esc(set().phone)}</a>` : ''}</span></div></div>`;
function renderTeacher(){
  const t = S.teachers[0]; if (!t) return;
  const ns = sortBy(S.notices, 'createdAt', -1), ex = [...S.exams].sort((a,b) => (a.date+a.period).localeCompare(b.date+b.period));
  const ck = ctrlTasks(t.id);
  const pend = ns.filter(n => n.status === 'issued').length + ex.filter(e => !e.recv || !e.ret).length + ((ck.rows.length || ck.obs.length) && !S.ctrlsigns.length ? 1 : 0);
  $('#gateRoot').innerHTML = `<div class="portal">${portalHead('الأستاذ/ ' + t.name, esc(t.specialty || ''))}
    ${pend ? `<div class="notice-bar">لديك ${pend} ${pend === 1 ? 'إجراء ينتظر' : 'إجراءات تنتظر'} توقيعك.</div>` : '<div class="done">لا يوجد ما ينتظر توقيعك. شكرًا لك.</div>'}
    <section class="panel"><h3>المساءلات</h3>${ns.length ? `<div class="list">${ns.map(n => { const [c,l] = nStatus(n); return `<div class="row"><div><div class="t">مساءلة رقم <span class="num">${esc(n.no)}</span> · ${esc(n.kind)}</div><div class="m">${esc(dayName(n.date))} ${esc(hij(n.date))}${n.decision ? ' · القرار: ' + esc(DECISIONS[n.decision]) : ''}</div></div><div class="tools"><span class="chip ${c}">${l}</span>${n.status === 'issued' ? `<button class="btn sm pri" data-act="reply" data-id="${n.id}">كتابة الإفادة والتوقيع</button>` : ''}<button class="btn sm" data-act="viewNotice" data-id="${n.id}">عرض</button></div></div>`; }).join('')}</div>` : '<div class="empty">لا توجد مساءلات عليك.</div>'}</section>
    ${teacherCtrlPanel()}
    <section class="panel"><h3>مظاريف الاختبارات</h3><p class="sub">وقّع عند استلام مظروف الأسئلة من الكنترول، ثم عند تسليم أوراق الإجابة.</p>${ex.length ? `<div class="list">${ex.map(e => `<div class="row"><div><div class="t">${esc(e.subject)} · ${esc(e.grade||'')}</div><div class="m">${esc(dayName(e.date))} ${esc(hij(e.date))} · الفترة ${esc(e.period||'')} · ${esc(committee(e.committeeId)?.name||'')}</div></div><div class="tools">
      ${e.recv ? '<span class="chip ok">استُلمت الأسئلة</span>' : `<button class="btn sm pri" data-act="envRecv" data-id="${e.id}">توقيع الاستلام</button>`}
      ${e.ret ? '<span class="chip ok">سُلّمت الإجابات</span>' : e.recv ? `<button class="btn sm pri" data-act="envRet" data-id="${e.id}">توقيع التسليم</button>` : ''}</div></div>`).join('')}</div>` : '<div class="empty">لم تُسند إليك ملاحظة اختبارات.</div>'}</section>
    <p class="m" style="color:var(--muted);font-size:12px;text-align:center">هذا رابطك الخاص؛ لا تشاركه مع غيرك.</p></div>`;
}
function renderParent(){
  const p = S.parents[0]; if (!p) return;
  $('#gateRoot').innerHTML = `<div class="portal">${portalHead(p.kind, 'ولي أمر الطالب/ ' + esc(p.student))}
    ${p.parentSig ? `<div class="done">تم التوقيع بتاريخ ${esc(stamp(p.parentSig.at))}. شكرًا لتعاونكم.</div>` : `<div class="notice-bar">اقرأ النموذج ثم اضغط «التوقيع» في أسفله.</div>`}
    ${parentDoc(p)}
    <div class="tools">${!p.parentSig ? `<button class="btn pri" data-act="signParent" data-id="${p.id}">التوقيع</button>` : ''}<button class="btn" data-act="printParent" data-id="${p.id}">طباعة / PDF</button></div></div>`;
}
async function startPortal(){
  gate('<p>جارٍ فتح النموذج…</p>');
  try {
    if (MODE === 'teacher') { const d = await api('/t/' + KEY); S.teachers = [d.teacher]; S.notices = d.notices; S.exams = d.exams; S.committees = d.committees; S.grading = d.grading || []; S.ctrlsigns = d.ctrlsign ? [{id:d.teacher.id, ...d.ctrlsign}] : []; S.settings = d.settings; }
    else { const d = await api('/p/' + KEY); S.parents = [d.form]; S.settings = d.settings; }
    S.loaded = true; $('#gateRoot').innerHTML = ''; render();
  } catch(e){ gate(`<h1>تعذّر فتح الرابط</h1><p>${esc(errMsg(e))}</p><p>تواصل مع إدارة المدرسة للحصول على رابط صحيح.</p>`); }
}

function boot(){
  if (MODE !== 'admin') return startPortal();
  if (token) startAdmin(); else if (/[#&]key=/.test(location.hash) || store.get('mdr.newcode')) showRegister(); else showLogin();
}
boot();
})();
</script>
</body>
</html>
